<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FunnelIQ — ניתוח קמפיינים</title>
<meta name="description" content="FunnelIQ מנתח את נתוני הקמפיינים של החברה שלך, מאמן עליהם מודלים ומראה איפה התקציב עובד ואיפה הוא נשרף.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="FunnelIQ">
<meta property="og:description" content="ניתוח קמפיינים ומודלים שמאומנים על הנתונים שלך בלבד.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap">
<script>
  // Runs before the stylesheet paints anything. Reading the stored choice here
  // rather than in the main script is the difference between a dark-mode user
  // seeing their theme and seeing a white flash on every page load.
  try{
    var t = localStorage.getItem("funneliq.theme");
    if(!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){ document.documentElement.setAttribute("data-theme", "light"); }
</script>
<style>
/* ═══════════════════════════════════════════════════════════ tokens
   Every colour, size and shadow in the product is named here once. Two themes
   are defined as the same names with different values, so nothing below this
   block knows which theme it is drawing — that is what makes the toggle a
   one-line change rather than a second stylesheet. */
:root{
  color-scheme: light;

  /* Neutrals, cool-leaning. Nine steps because eight is never quite enough. */
  --n-0:#ffffff; --n-25:#fcfcfd; --n-50:#f8f9fc; --n-100:#f1f3f9;
  --n-200:#e4e8f0; --n-300:#cfd5e2; --n-400:#9aa3b8;
  --n-500:#6b7488; --n-600:#4a5265; --n-700:#333a4a; --n-800:#1f2534; --n-900:#12161f;

  /* One confident accent. A product that uses three looks like three products. */
  --accent-50:#eef2ff; --accent-100:#e0e7ff; --accent-300:#a5b4fc;
  --accent:#4f46e5; --accent-600:#4338ca; --accent-700:#3730a3;

  /* Chart colours, kept apart from the semantic ones. Green here means "the
     second series", not "good news"; mixing the two is how a chart ends up
     telling a story its own data does not support. */
  --c1:#4f46e5; --c2:#0ea5e9; --c3:#10b981; --c4:#f59e0b; --c5:#ec4899;
  --tint-1:#eef2ff; --tint-2:#e0f2fe; --tint-3:#ecfdf5;
  --tint-4:#fef3c7; --tint-5:#fce7f3;

  --pos-50:#ecfdf5; --pos:#059669; --pos-700:#047857;
  --warn-50:#fffbeb; --warn:#b45309; --warn-700:#92400e;
  --neg-50:#fef2f2; --neg:#dc2626; --neg-700:#b91c1c;

  /* Roles. Components reference these, never the raw scale above. */
  --bg:var(--n-50);
  --surface:var(--n-0);
  --surface-2:var(--n-25);
  --surface-3:var(--n-100);
  --line:var(--n-200);
  --line-strong:var(--n-300);
  --text:var(--n-800);
  --text-2:var(--n-600);
  --text-3:var(--n-500);
  --brand:var(--accent);
  --brand-ink:var(--accent-600);
  --brand-soft:var(--accent-50);
  --on-brand:#ffffff;

  /* A type scale with a ratio, not fifteen arbitrary pixel values. */
  --t-xs:12px; --t-sm:13px; --t-md:14.5px; --t-lg:16px;
  --t-xl:19px; --t-2xl:23px; --t-3xl:29px; --t-4xl:36px;

  /* Spacing on a 4px grid. */
  /* Widened after "the boxes crowd each other": every gap below is larger
     than it was, and they all come from here. */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px;
  --s-6:32px; --s-8:40px; --s-10:48px; --s-12:64px; --s-16:80px;

  --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:999px;

  /* Layered rather than single: a real object casts a tight contact shadow and
     a wide soft one, and the eye reads the difference even when it cannot name it. */
  --sh-xs:0 1px 2px rgb(16 24 40 / .05);
  --sh-sm:0 1px 2px rgb(16 24 40 / .06), 0 1px 3px rgb(16 24 40 / .04);
  --sh-md:0 2px 4px rgb(16 24 40 / .04), 0 8px 20px rgb(16 24 40 / .07);
  --sh-lg:0 4px 8px rgb(16 24 40 / .04), 0 20px 44px rgb(16 24 40 / .10);
  --ring:0 0 0 3px color-mix(in srgb, var(--brand) 28%, transparent);

  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:130ms; --base:200ms;
  --nav-w:264px;
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b0e14;
  --surface:#12161f;
  --surface-2:#161b26;
  --surface-3:#1d2431;
  --line:#242c3a;
  --line-strong:#333c4e;
  --text:#e8ebf2;
  --text-2:#a8b0c2;
  --text-3:#7d8598;
  --brand:#7c8cff;
  --brand-ink:#93a0ff;
  --brand-soft:#1a1f36;
  --on-brand:#0b0e14;
  --pos-50:#0d2620; --pos:#34d399; --pos-700:#6ee7b7;
  --warn-50:#2a2113; --warn:#fbbf24; --warn-700:#fcd34d;
  --neg-50:#2b1416; --neg:#f87171; --neg-700:#fca5a5;
  --c1:#818cf8; --c2:#38bdf8; --c3:#34d399; --c4:#fbbf24; --c5:#f472b6;
  --tint-1:#1e1b3a; --tint-2:#0c2a3d; --tint-3:#0d2b22;
  --tint-4:#2e2410; --tint-5:#2e1524;
  --sh-xs:0 1px 2px rgb(0 0 0 / .4);
  --sh-sm:0 1px 3px rgb(0 0 0 / .45);
  --sh-md:0 4px 16px rgb(0 0 0 / .5);
  --sh-lg:0 12px 40px rgb(0 0 0 / .6);
}

/* The same values, applied when the browser asks for dark and the person has
   not overridden it. Duplicated because plain CSS has no way to share a token
   block between two selectors; a test asserts the two stay identical. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0b0e14;
  --surface:#12161f;
  --surface-2:#161b26;
  --surface-3:#1d2431;
  --line:#242c3a;
  --line-strong:#333c4e;
  --text:#e8ebf2;
  --text-2:#a8b0c2;
  --text-3:#7d8598;
  --brand:#7c8cff;
  --brand-ink:#93a0ff;
  --brand-soft:#1a1f36;
  --on-brand:#0b0e14;
  --pos-50:#0d2620; --pos:#34d399; --pos-700:#6ee7b7;
  --warn-50:#2a2113; --warn:#fbbf24; --warn-700:#fcd34d;
  --neg-50:#2b1416; --neg:#f87171; --neg-700:#fca5a5;
  --c1:#818cf8; --c2:#38bdf8; --c3:#34d399; --c4:#fbbf24; --c5:#f472b6;
  --tint-1:#1e1b3a; --tint-2:#0c2a3d; --tint-3:#0d2b22;
  --tint-4:#2e2410; --tint-5:#2e1524;
  --sh-xs:0 1px 2px rgb(0 0 0 / .4);
  --sh-sm:0 1px 3px rgb(0 0 0 / .45);
  --sh-md:0 4px 16px rgb(0 0 0 / .5);
  --sh-lg:0 12px 40px rgb(0 0 0 / .6);
  }
}

/* ═══════════════════════════════════════════════════════════ base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  /* Two very quiet washes, placed where nobody is reading, so the panels sit
     on something instead of floating on one flat fill. */
  background-image:
    radial-gradient(1100px 560px at 88% -12%,
      color-mix(in srgb, var(--brand) 6%, transparent), transparent 60%),
    radial-gradient(860px 480px at -6% 106%,
      color-mix(in srgb, var(--brand) 4%, transparent), transparent 56%);
  background-attachment:fixed;
  color:var(--text);
  font:400 var(--t-md)/1.6 "Assistant", -apple-system, BlinkMacSystemFont,
       "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"tnum" 0;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25;letter-spacing:-.018em}
h1{font-size:var(--t-3xl);font-weight:800}
h2{font-size:var(--t-xl)}
h3{font-size:var(--t-lg)}
p{margin:0}
a{color:var(--brand-ink);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-color:var(--brand)}
svg{flex:none}
hr{border:0;border-top:1px solid var(--line);margin:var(--s-6) 0}

:where(button,a,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-xs);
}
::selection{background:var(--brand-soft);color:var(--brand-ink)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* Digits and currency read left-to-right inside Hebrew sentences. Without the
   isolation "₪1,240" scatters its symbols to the wrong side of the number. */
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:0}

.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;inset-inline-start:-9999px;top:var(--s-3);z-index:200;
      background:var(--brand);color:var(--on-brand);padding:var(--s-3) var(--s-5);
      border-radius:var(--r-sm);font-weight:600;box-shadow:var(--sh-lg)}
.skip:focus{inset-inline-start:var(--s-3)}

/* ═══════════════════════════════════════════════════════════ controls */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  padding:10px var(--s-5);border:1px solid transparent;border-radius:var(--r-sm);
  font:inherit;font-weight:600;font-size:var(--t-md);line-height:1.2;
  cursor:pointer;white-space:nowrap;
  transition:background var(--fast) var(--ease), border-color var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:var(--sh-xs)}
.btn-primary:hover:not([disabled]){background:var(--brand-ink);box-shadow:var(--sh-sm)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--line-strong);
               box-shadow:var(--sh-xs)}
.btn-secondary:hover:not([disabled]){background:var(--surface-3);border-color:var(--n-400)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover:not([disabled]){background:var(--surface-3);color:var(--text)}
.btn-danger{background:transparent;color:var(--neg);border-color:var(--line-strong)}
.btn-danger:hover:not([disabled]){background:var(--neg-50);border-color:var(--neg)}
.btn-sm{padding:6px var(--s-3);font-size:var(--t-sm)}
.btn-block{width:100%}
.btn-icon{padding:8px;border-radius:var(--r-sm)}

label{display:block;font-size:var(--t-sm);font-weight:600;margin-bottom:var(--s-2);
      color:var(--text-2)}
input,select,textarea{
  width:100%;padding:10px var(--s-3);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);font:inherit;font-size:var(--t-md);
  transition:border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
input:hover,select:hover{border-color:var(--n-400)}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:var(--ring);
}
input::placeholder{color:var(--text-3)}
select{appearance:none;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),
                   linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(var(--s-4) - 4px) calc(50% + 1px), calc(var(--s-4) + 1px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-inline-start:var(--s-8);
}
.field{margin-bottom:var(--s-5)}
.hint{font-size:var(--t-xs);color:var(--text-3);margin-top:var(--s-2);line-height:1.5}

/* ═══════════════════════════════════════════════════════════ auth screen */
.auth{min-height:100dvh;display:grid;place-items:center;padding:var(--s-6);
      background:
        radial-gradient(900px 500px at 85% -8%, var(--brand-soft), transparent 60%),
        radial-gradient(700px 500px at 5% 105%, var(--surface-3), transparent 55%),
        var(--bg);
}
.auth-card{
  width:100%;max-width:430px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-xl);
  padding:var(--s-10) var(--s-8) var(--s-8);box-shadow:var(--sh-lg);
}
.logo{display:flex;align-items:center;gap:10px;font-size:var(--t-2xl);
      font-weight:800;letter-spacing:-.03em}
.logo .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
            background:var(--brand);color:var(--on-brand);flex:none;box-shadow:var(--sh-sm)}
.logo em{font-style:normal;color:var(--brand)}
.tagline{color:var(--text-2);font-size:var(--t-md);margin:var(--s-3) 0 var(--s-6)}

.tabs{display:flex;gap:var(--s-1);background:var(--surface-3);
      border-radius:var(--r-sm);padding:var(--s-1);margin-bottom:var(--s-6)}
.tabs button{flex:1;padding:9px;border:0;border-radius:var(--r-xs);background:transparent;
             font:inherit;font-weight:600;font-size:var(--t-md);color:var(--text-2);
             cursor:pointer;transition:all var(--fast) var(--ease)}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);
                                   box-shadow:var(--sh-sm)}

.social{display:flex;flex-direction:column;gap:var(--s-2)}
.social .btn{justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:var(--s-3);margin:var(--s-5) 0;
    color:var(--text-3);font-size:var(--t-sm)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.choice{border:0;padding:0;margin:0 0 var(--s-5)}
.choice legend{font-size:var(--t-sm);font-weight:600;color:var(--text-2);
               margin-bottom:var(--s-2);padding:0}
.pick{display:flex;gap:10px;align-items:flex-start;padding:var(--s-3);
      border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;
      margin-bottom:var(--s-2);transition:all var(--fast) var(--ease)}
.pick:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pick:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.pick input{width:auto;margin-top:3px;accent-color:var(--brand);flex:none}
.pick b{display:block;font-size:var(--t-md)}
.pick em{display:block;font-style:normal;font-size:var(--t-xs);color:var(--text-2);
         margin-top:2px;line-height:1.5}

.segmented{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface-3);
  border:1px solid var(--line);border-radius:var(--r-md);padding:4px;
  margin-bottom:var(--s-6)}
.segmented button{border:0;background:transparent;font:inherit;font-size:var(--t-md);
  font-weight:600;color:var(--text-2);padding:8px 14px;border-radius:var(--r-sm);
  cursor:pointer;transition:all var(--fast) var(--ease);white-space:nowrap}
.segmented button:hover{color:var(--text)}
.segmented button[aria-selected="true"]{background:var(--surface);color:var(--text);
  box-shadow:var(--sh-sm)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t-sm);
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-xs);
  padding:3px 8px;cursor:pointer;user-select:all}
.code:hover{border-color:var(--brand);color:var(--brand-ink)}

/* --------------------------------------------------------- month picker */
.mp{position:relative}
.mp-field{display:flex;align-items:center;gap:var(--s-2);width:100%;
  padding:10px var(--s-3);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);font:inherit;font-size:var(--t-md);
  cursor:pointer;text-align:start;transition:border-color var(--fast) var(--ease),
  box-shadow var(--fast) var(--ease)}
.mp-field:hover{border-color:var(--n-400)}
.mp-field[aria-expanded="true"]{border-color:var(--brand);box-shadow:var(--ring)}
.mp-text{flex:1;font-weight:600}
.mp-caret{color:var(--text-3)}
.mp-pop{position:absolute;z-index:30;inset-inline-start:0;top:calc(100% + 6px);
  width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:var(--s-3)}
.mp-head{display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--s-1) var(--s-3);font-size:var(--t-lg)}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mp-cell{padding:9px 4px;border:1px solid transparent;border-radius:var(--r-xs);
  background:transparent;color:var(--text);font:inherit;font-size:var(--t-sm);
  font-weight:600;cursor:pointer;transition:all var(--fast) var(--ease)}
.mp-cell:hover:not([disabled]){background:var(--surface-3)}
.mp-cell.on{background:var(--brand);color:var(--on-brand)}
.mp-cell[disabled]{opacity:.35;cursor:not-allowed}

.pw{position:relative}
.pw input{padding-inline-start:66px}
.pw button{position:absolute;inset-inline-start:5px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;font:inherit;font-size:var(--t-sm);font-weight:600;
  color:var(--brand-ink);cursor:pointer;padding:6px var(--s-2);border-radius:var(--r-xs)}
.pw button:hover{background:var(--brand-soft)}

.msg{margin-top:var(--s-4);padding:11px var(--s-4);border-radius:var(--r-sm);
     font-size:var(--t-md);display:none;border:1px solid transparent;line-height:1.5}
.msg:not(:empty){display:block}
.msg.err{background:var(--neg-50);color:var(--neg-700);border-color:color-mix(in srgb,var(--neg) 25%,transparent)}
.msg.ok{background:var(--pos-50);color:var(--pos-700);border-color:color-mix(in srgb,var(--pos) 25%,transparent)}

/* ═══════════════════════════════════════════════════════════ app shell */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100dvh}
.side{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  gap:var(--s-6);padding:var(--s-6) var(--s-4);
  background:linear-gradient(to bottom,
      color-mix(in srgb,var(--surface) 95%,var(--brand) 5%), var(--surface) 240px);
  border-inline-start:1px solid var(--line);
}
.side-head{display:flex;align-items:center;justify-content:space-between;
           gap:var(--s-2);padding-inline:var(--s-2)}
.side .logo{font-size:var(--t-xl)}
.side .logo .mark{width:30px;height:30px;border-radius:9px}
.co-logo{max-height:34px;max-width:140px;object-fit:contain;display:block}

.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:9px var(--s-3);
  border-radius:var(--r-sm);color:var(--text-2);text-decoration:none;
  font-weight:600;font-size:var(--t-md);position:relative;
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
.nav a[aria-current="page"]::before{
  content:"";position:absolute;inset-inline-end:calc(var(--s-4) * -1);top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:3px;background:var(--brand);
}
.nav svg{width:18px;height:18px;stroke-width:2}
.nav-label{font-size:var(--t-xs);font-weight:700;color:var(--text-3);
           text-transform:uppercase;letter-spacing:.06em;padding:0 var(--s-3);
           margin-bottom:var(--s-2)}

.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:var(--s-4)}
.who-row{display:flex;align-items:center;gap:10px;padding:var(--s-2)}
.avatar{width:32px;height:32px;border-radius:var(--r-full);flex:none;display:grid;
        place-items:center;background:var(--brand-soft);color:var(--brand-ink);
        font-weight:700;font-size:var(--t-sm)}
.who-text{min-width:0;flex:1}
.who-text b{display:block;font-size:var(--t-sm);font-weight:700;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-text span{display:block;font-size:var(--t-xs);color:var(--text-3);
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding:var(--s-8) var(--s-10) var(--s-16);max-width:1180px;width:100%}
/* One rule owns the space between blocks. Every section, grid and callout is a
   direct child here, so nothing carries its own margin and nothing disagrees. */
#pageBody{display:flex;flex-direction:column;gap:var(--s-6)}
.page-head{margin-bottom:var(--s-8)}
.page-head h1{margin-bottom:var(--s-2)}
.page-head p{color:var(--text-2);max-width:68ch;font-size:var(--t-lg)}

.topbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-end:0;width:min(84vw,var(--nav-w));
        z-index:60;transform:translateX(100%);box-shadow:var(--sh-lg);
        transition:transform var(--base) var(--ease)}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);
          position:sticky;top:0;z-index:40;padding:var(--s-3) var(--s-4);
          background:color-mix(in srgb,var(--surface) 88%,transparent);
          backdrop-filter:saturate(180%) blur(12px);
          border-bottom:1px solid var(--line)}
  .scrim{position:fixed;inset:0;z-index:50;background:rgb(9 12 18 / .5);
         opacity:0;pointer-events:none;transition:opacity var(--base) var(--ease)}
  .scrim.on{opacity:1;pointer-events:auto}
  main{padding:var(--s-5) var(--s-4) var(--s-12)}
  .page-head p{font-size:var(--t-md)}
  h1{font-size:var(--t-2xl)}
}

/* ═══════════════════════════════════════════════════════════ surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:var(--s-6);box-shadow:var(--sh-sm);position:relative}
.card>h2{margin-bottom:var(--s-1)}
.card>.sub{color:var(--text-2);font-size:var(--t-md);margin-bottom:var(--s-5);max-width:78ch}
.card>.table-wrap{margin-top:var(--s-5)}
.card>.chart-funnel,.card>.chart-bars,.card>.chart-donut{margin-top:var(--s-5)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;
           gap:var(--s-4);flex-wrap:wrap;margin-bottom:var(--s-5)}
.card-head>div{min-width:0}
.card-head h2{margin-bottom:var(--s-1)}
.card-head .sub{margin:0}

.grid{display:grid;gap:var(--s-5);grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid-2{display:grid;gap:var(--s-5);grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:var(--s-5);box-shadow:var(--sh-sm);
      transition:box-shadow var(--base) var(--ease), transform var(--base) var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile{position:relative;overflow:hidden}
/* A row of figures used to be five white boxes. Each tint is a wash, not a
   fill: the number still has to be the loudest thing in the card. */
.tile.t1{background:linear-gradient(160deg,var(--tint-1),var(--surface) 64%)}
.tile.t2{background:linear-gradient(160deg,var(--tint-2),var(--surface) 64%)}
.tile.t3{background:linear-gradient(160deg,var(--tint-3),var(--surface) 64%)}
.tile.t4{background:linear-gradient(160deg,var(--tint-4),var(--surface) 64%)}
.tile.t5{background:linear-gradient(160deg,var(--tint-5),var(--surface) 64%)}
/* A hairline rail on hover. Four identical rectangles in a row read as a
   table; this gives the one under the pointer an edge to be read from. */
.tile::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;
  width:3px;background:var(--brand);opacity:0;
  transition:opacity var(--base) var(--ease)}
.tile:hover::before{opacity:.7}
.tile .k{font-size:var(--t-sm);color:var(--text-2);font-weight:600;
  letter-spacing:.01em}
.tile .v{font-size:var(--t-3xl);font-weight:800;letter-spacing:-.035em;
         margin-top:var(--s-2);line-height:1.05;
         font-variant-numeric:tabular-nums lining-nums}
.tile .n{font-size:var(--t-xs);color:var(--text-3);margin-top:var(--s-2);line-height:1.5}
.tile .actual{font-size:var(--t-xs);color:var(--text-3);margin-top:var(--s-1)}
.null{color:var(--text-3);font-weight:400}

.card > .callout:not(:first-child){margin-top:var(--s-5)}
.callout{border-radius:var(--r-md);padding:var(--s-4) var(--s-5);
         font-size:var(--t-md);line-height:1.7;border:1px solid transparent}
.callout.brand{background:var(--brand-soft);color:var(--text);
               border-color:color-mix(in srgb,var(--brand) 22%,transparent)}
.callout.brand strong{color:var(--brand-ink)}
.callout.warn{background:var(--warn-50);color:var(--warn-700);
              border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.callout.neg{background:var(--neg-50);color:var(--neg-700);
             border-color:color-mix(in srgb,var(--neg) 25%,transparent)}
.callout.pos{background:var(--pos-50);color:var(--pos-700);
             border-color:color-mix(in srgb,var(--pos) 25%,transparent)}
.callout h3{margin-bottom:var(--s-1);font-size:var(--t-md)}
.callout ul{margin:var(--s-2) 0 0;padding-inline-start:var(--s-5);line-height:1.8}
.note{color:var(--text-3);font-size:var(--t-sm);margin-top:var(--s-3);line-height:1.6}

/* ═══════════════════════════════════════════════════════════ data */
/* ═══════════════════════════════════════════════════════════ charts */
.chart-bars{display:flex;flex-direction:column;gap:12px}
.cb-row{display:grid;grid-template-columns:minmax(88px,168px) 1fr auto;
        align-items:center;gap:var(--s-4)}
.cb-label{font-weight:600;font-size:var(--t-md);overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
.cb-track{background:var(--surface-3);border-radius:var(--r-full);
          height:26px;overflow:hidden}
.cb-fill{display:block;height:100%;border-radius:var(--r-full);
         transition:width .5s var(--ease)}
.cb-value{font-weight:700;font-size:var(--t-md);white-space:nowrap;
          font-variant-numeric:tabular-nums}
.cb-value em{display:block;font-style:normal;font-weight:400;
             font-size:var(--t-xs);color:var(--text-3)}

.chart-funnel{display:flex;flex-direction:column;gap:14px}
.cf-row{display:grid;grid-template-columns:minmax(96px,150px) 1fr minmax(0,150px);
        align-items:center;gap:var(--s-4)}
.cf-label{font-weight:600;font-size:var(--t-md)}
.cf-bar{height:38px;border-radius:var(--r-sm);display:flex;align-items:center;
        padding-inline:12px;color:#fff;font-weight:700;
        font-variant-numeric:tabular-nums;transition:width .5s var(--ease);
        box-shadow:var(--sh-xs)}
.cf-lost{font-size:var(--t-sm);color:var(--neg);font-weight:700;
         font-variant-numeric:tabular-nums}
.cf-lost em{display:block;font-style:normal;font-weight:400;
            font-size:var(--t-xs);color:var(--text-3)}

.chart-donut{display:flex;align-items:center;gap:var(--s-6);flex-wrap:wrap}
.chart-donut svg{width:172px;height:172px;flex:none}
.donut-total{font-size:19px;font-weight:800;fill:var(--text)}
.donut-cap{font-size:11px;fill:var(--text-3)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
        gap:10px;font-size:var(--t-md)}
.legend li{display:flex;align-items:center;gap:9px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.legend b{font-variant-numeric:tabular-nums}
.legend em{font-style:normal;color:var(--text-3);font-size:var(--t-sm)}

.chart-line svg{width:100%;height:190px;display:block}
.cl-axis{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.cl-axis span{display:flex;flex-direction:column;align-items:center;
              font-size:var(--t-xs);color:var(--text-3);text-align:center;flex:1}
.cl-axis b{font-size:var(--t-md);color:var(--text);
           font-variant-numeric:tabular-nums}

.why{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);
     background:var(--surface);color:var(--text-3);font-size:11px;font-weight:700;
     cursor:pointer;padding:0;line-height:1;margin-inline-start:6px;
     vertical-align:middle}
.why:hover{border-color:var(--brand);color:var(--brand-ink)}
.why-pop{position:absolute;z-index:40;max-width:280px;background:var(--n-800);
         color:#fff;padding:10px 13px;border-radius:var(--r-sm);
         font-size:var(--t-sm);font-weight:400;line-height:1.6;
         box-shadow:var(--sh-lg);margin-top:6px;inset-inline-start:0}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--s-4)}
.chip{padding:7px 15px;border:1px solid var(--line-strong);border-radius:var(--r-full);
      background:var(--surface);color:var(--text-2);font:inherit;font-size:var(--t-sm);
      font-weight:600;cursor:pointer;transition:all var(--fast) var(--ease)}
.chip:hover{border-color:var(--brand);color:var(--brand-ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.sorter{background:none;border:0;font:inherit;font-size:var(--t-xs);font-weight:700;
        color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;
        cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.sorter:hover{color:var(--brand-ink)}
.sorter.on{color:var(--brand-ink)}
.pager{display:flex;align-items:center;justify-content:center;gap:var(--s-4);
       margin-top:var(--s-4);font-size:var(--t-sm);color:var(--text-2)}
/* ══════════════════════════════════════════════ page structure
   Sections are grouped under their own heading rather than running together,
   which is what "everything collides" looked like: a card, a grid and a
   callout stacked with no hierarchy between them. */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;
           gap:var(--s-5);flex-wrap:wrap;padding-bottom:var(--s-5);
           border-bottom:1px solid var(--line)}
.page-actions{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap}
.band{display:flex;flex-direction:column;gap:var(--s-4)}
.band-title{font-size:var(--t-sm);font-weight:700;color:var(--text-3);
            text-transform:uppercase;letter-spacing:.08em;margin:0}
.period{display:flex;align-items:center;gap:10px;font-size:var(--t-sm);
        font-weight:600;color:var(--text-2);white-space:nowrap}
.period select{width:auto;min-width:150px}

.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;
         gap:var(--s-4);margin:var(--s-5) 0;position:relative}
.compare-side{display:flex;flex-direction:column;gap:6px;padding:var(--s-5);
              border:1px solid var(--line);border-radius:var(--r-md);
              background:var(--surface-2)}
.compare-side.is-after{border-color:color-mix(in srgb,var(--c3) 45%,transparent);
                       background:var(--tint-3)}
.compare-cap{font-size:var(--t-sm);color:var(--text-2);font-weight:600}
.compare-num{font-size:var(--t-2xl);font-weight:800;letter-spacing:-.03em;
             font-variant-numeric:tabular-nums}
.compare-sub{font-size:var(--t-sm);color:var(--text-3);
             font-variant-numeric:tabular-nums}
.compare-arrow{display:grid;place-items:center;color:var(--text-3)}
.compare-delta{grid-column:1/-1;justify-self:center;padding:5px 16px;
               border-radius:var(--r-full);background:var(--pos-50);
               color:var(--pos-700);font-weight:700;font-size:var(--t-sm)}
@media (max-width:640px){
  .compare{grid-template-columns:1fr}
  .compare-arrow{transform:rotate(90deg)}
}

.advice-head{display:flex;align-items:flex-start;justify-content:space-between;
             gap:var(--s-4);flex-wrap:wrap;margin-bottom:var(--s-4)}
.advice-title{display:flex;flex-direction:column;gap:8px;min-width:0}
.advice-title h2{margin:0}
.impact{padding:8px 16px;border-radius:var(--r-full);font-weight:700;
        font-size:var(--t-md);white-space:nowrap;background:var(--surface-3)}
.impact.t1{background:var(--tint-1)} .impact.t2{background:var(--tint-2)}
.impact.t3{background:var(--tint-3)} .impact.t4{background:var(--tint-4)}
.impact.t5{background:var(--tint-5)}
.advice-body{font-size:var(--t-lg);line-height:1.75;color:var(--text);
             max-width:74ch}
.advice-chart{margin-top:var(--s-5)}
.basis-toggle{margin-top:var(--s-5)}
.basis{margin-top:var(--s-4);padding:var(--s-4) var(--s-5);
       background:var(--surface-2);border:1px solid var(--line);
       border-radius:var(--r-md);font-size:var(--t-md);line-height:1.8;
       color:var(--text-2);max-width:80ch}

.nav-group{font-size:var(--t-xs);font-weight:700;color:var(--text-3);
           text-transform:uppercase;letter-spacing:.07em;
           padding:var(--s-4) var(--s-3) var(--s-2);list-style:none}
.nav-group:first-child{padding-top:0}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);
            background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--t-md);min-width:520px}
th,td{padding:11px var(--s-4);text-align:start;border-bottom:1px solid var(--line);
      white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:var(--surface-2);
   font-weight:700;font-size:var(--t-xs);color:var(--text-3);
   text-transform:uppercase;letter-spacing:.05em}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--fast) var(--ease)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
tbody tr:hover{background:var(--surface-3)}
td bdi,td .num{font-variant-numeric:tabular-nums lining-nums}
tr.pos td{background:var(--pos-50)} tr.neg td{background:var(--neg-50)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
       border-radius:var(--r-full);font-size:var(--t-xs);font-weight:700;
       border:1px solid transparent;white-space:nowrap}
.badge.pos{background:var(--pos-50);color:var(--pos-700);
           border-color:color-mix(in srgb,var(--pos) 25%,transparent)}
.badge.neg{background:var(--neg-50);color:var(--neg-700);
           border-color:color-mix(in srgb,var(--neg) 25%,transparent)}
.badge.mute{background:var(--surface-3);color:var(--text-3);border-color:var(--line)}
.badge.brand{background:var(--brand-soft);color:var(--brand-ink);
             border-color:color-mix(in srgb,var(--brand) 22%,transparent)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;
         align-items:center;gap:var(--s-4);font-size:var(--t-md)}
.bar-lbl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--surface-3);border-radius:var(--r-full);height:22px;overflow:hidden}
.bar{height:100%;border-radius:var(--r-full);background:var(--brand);min-width:3px;
     transition:width var(--base) var(--ease)}
.bar.pos{background:var(--pos)} .bar.warn{background:var(--warn)} .bar.neg{background:var(--neg)}
.bar-val{color:var(--text-2);font-size:var(--t-sm);text-align:start;white-space:nowrap}

.filters{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
         background:var(--surface-2);border:1px solid var(--line);
         border-radius:var(--r-md);padding:var(--s-5);margin-bottom:var(--s-5)}
.sub-head{margin-top:var(--s-6);margin-bottom:var(--s-2)}
.filters label{font-size:var(--t-xs)}
.pred{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
      margin-top:var(--s-5)}
.pred .tile .v{font-size:var(--t-2xl)}

/* ═══════════════════════════════════════════════════════════ states */
.empty{background:var(--surface);border:1px dashed var(--line-strong);
       border-radius:var(--r-xl);padding:var(--s-16) var(--s-6);text-align:center}
.empty .art{width:60px;height:60px;margin:0 auto var(--s-5);border-radius:var(--r-lg);
            display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.empty h2{margin-bottom:var(--s-3)}
.empty p{color:var(--text-2);max-width:54ch;margin:0 auto}

.drop{border:2px dashed var(--line-strong);border-radius:var(--r-lg);
      background:var(--surface-2);padding:var(--s-10) var(--s-5);text-align:center;
      cursor:pointer;transition:all var(--fast) var(--ease)}
.drop:hover{border-color:var(--brand);background:var(--brand-soft)}
.drop.over{border-color:var(--brand);background:var(--brand-soft);transform:scale(1.005)}
.drop .art{width:44px;height:44px;margin:0 auto var(--s-3);color:var(--brand)}
.drop .name{font-weight:700;margin-top:var(--s-2);color:var(--brand-ink)}

.skeleton{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);
          background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r-sm)}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-line{height:13px;margin-bottom:10px}
.sk-tile{height:112px;border-radius:var(--r-lg)}

.spinner{width:15px;height:15px;border:2px solid color-mix(in srgb,currentColor 30%,transparent);
         border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.row-actions{display:flex;gap:var(--s-3);flex-wrap:wrap;margin-top:var(--s-5)}

/* ═══════════════════════════════════════════════════════════ toasts
   Replacing alert(), which blocks the page, cannot be styled, and says
   "localhost says" in Chrome — three things a product being sold should not do. */
.toasts{position:fixed;inset-block-end:var(--s-6);inset-inline-start:var(--s-6);
        z-index:300;display:flex;flex-direction:column;gap:10px;max-width:min(92vw,400px)}
.toast{display:flex;gap:11px;align-items:flex-start;padding:var(--s-4);
       background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
       box-shadow:var(--sh-lg);font-size:var(--t-md);line-height:1.5;
       animation:rise var(--base) var(--ease)}
.toast .ic{flex:none;margin-top:1px}
.toast.pos .ic{color:var(--pos)} .toast.neg .ic{color:var(--neg)}
.toast.warn .ic{color:var(--warn)} .toast.info .ic{color:var(--brand)}
.toast button{margin-inline-start:auto;background:none;border:0;cursor:pointer;
              color:var(--text-3);padding:2px;border-radius:var(--r-xs)}
.toast button:hover{color:var(--text)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}

details>summary{cursor:pointer;font-weight:600;color:var(--text-2);
                padding:var(--s-2) 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";display:inline-block;margin-inline-end:6px;
                        transition:transform var(--fast) var(--ease)}
details[open]>summary::before{transform:rotate(-90deg)}

@media print{
  .side,.topbar,.toasts,.skip,.row-actions{display:none!important}
  .shell{grid-template-columns:1fr}
  .card,.tile{box-shadow:none;break-inside:avoid}
  main{padding:0;max-width:none}
}
</style>
</head>

<script>
const TOKEN_KEY = "funneliq.token";
const $ = (id) => document.getElementById(id);

/* ------------------------------------------------------------------ auth */
// Both go through our own server rather than straight to Supabase. Supabase
// answers in English, and this page is Hebrew; routing through the server puts
// every refusal in one place instead of translating some of them here and
// leaving the rest as "Invalid login credentials". Signing in by company name
// could not work from the browser at all — the lookup it needs is one no
// anonymous caller is allowed to make.
async function post(path, body){
  const res = await fetch(path, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.detail || "הפעולה נכשלה");
  return data;
}

const signIn = (identifier, password) => post("/api/login", { identifier, password });

function saveSession(d, previous){
  const stored = {
    token: d.access_token,
    // Supabase retires a refresh token as soon as it is used and hands back a
    // new one, so whatever came with this response replaces what we held.
    refresh: d.refresh_token || (previous && previous.refresh) || null,
    email: (d.user && d.user.email) || (previous && previous.email) || null,
    // A minute early, so a request that starts just before the deadline does
    // not arrive with a token that died on the way.
    expiresAt: Date.now() + ((d.expires_in || 3600) - 60) * 1000,
  };
  localStorage.setItem(TOKEN_KEY, JSON.stringify(stored));
  return stored;
}

function readSession(){
  try{ return JSON.parse(localStorage.getItem(TOKEN_KEY) || "null"); }
  catch{ return null; }
}

function loadSession(){
  const s = readSession();
  return (s && s.expiresAt > Date.now()) ? s : null;
}

/* One renewal at a time. Supabase does allow a short reuse window, so racing
   requests would not actually fail — but each would come back with a different
   new token and the last write would win, leaving two of them holding one that
   is about to be retired. Serialising it means there is only ever one answer. */
let REFRESHING = null;

async function freshSession(){
  const live = loadSession();
  return live || renewNow();
}

/* Renew regardless of what our own clock believes, for the case where the
   server has already rejected a token we still trusted. */
async function renewNow(){
  const stored = readSession();
  if(!stored || !stored.refresh) return null;

  if(!REFRESHING){
    REFRESHING = (async () => {
      try{
        const renewed = await post("/api/token/refresh", { refreshToken: stored.refresh });
        return saveSession(renewed, stored);
      }catch{
        clearSession();
        return null;
      }finally{
        REFRESHING = null;
      }
    })();
  }
  return REFRESHING;
}
const clearSession = () => localStorage.removeItem(TOKEN_KEY);

async function api(path){
  // An expired token is renewed here rather than thrown. Until this existed,
  // an hour into the working day the next click ended the session — which is
  // what "clicking predictions logged me out" was.
  const s = await freshSession();
  if(!s) throw new Error("__expired__");
  let res = await fetch(path, { headers:{ "Authorization":"Bearer " + s.token } });
  if(res.status === 401){
    // The server disagrees with our clock: renew once and try again.
    //
    // This used to clear the session first, which threw away the refresh token
    // it was about to need — so one stale response signed the person out for
    // good instead of recovering. Clearing happens only after a renewal has
    // actually failed.
    const renewed = await renewNow();
    if(!renewed) throw new Error("__expired__");
    res = await fetch(path, { headers:{ "Authorization":"Bearer " + renewed.token } });
  }
  if(res.status === 401){ clearSession(); throw new Error("__expired__"); }
  if(!res.ok){
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `הבקשה נכשלה (${res.status})`);
  }
  return res.json();
}

/* ------------------------------------------------------------ formatting */
const nf  = new Intl.NumberFormat("he-IL");
const na  = () => '<span class="null">אין נתון</span>';
const num   = (v) => v == null ? na() : `<bdi class="num" dir="ltr">${nf.format(v)}</bdi>`;
const money = (v) => v == null ? na() : `<bdi class="num" dir="ltr">₪${nf.format(Math.round(v))}</bdi>`;
const pct   = (v) => v == null ? na() : `<bdi class="num" dir="ltr">${v}%</bdi>`;
const mult  = (v) => v == null ? na() : `<bdi class="num" dir="ltr">${v}x</bdi>`;
const bool  = (v) => v ? '<span class="badge pos">כן</span>' : '<span class="badge mute">לא</span>';
const TIER_HE = { Low:"נמוכה", Mid:"בינונית", High:"גבוהה" };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ═══════════════════════════════════════════════ theme, toasts, chrome
   The parts of a product that are invisible when they work: which theme you
   left it in, a message that does not block the page, and a confirmation that
   does not say "the site says" in the browser's own voice. */

const THEME_KEY = "funneliq.theme";
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
};
const svg = (name, size = 18) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  const dark = theme === "dark";
  const btn = $("themeBtn");
  if(btn){
    btn.innerHTML = svg(dark ? "sun" : "moon", 18);
    const label = dark ? "החלף למצב בהיר" : "החלף למצב כהה";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = dark ? "#0b0e14" : "#ffffff";
}

function initTheme(){
  let stored = null;
  try{ stored = localStorage.getItem(THEME_KEY); }catch{ /* private mode */ }
  // No stored choice means follow the system, and keep following it if the
  // person changes it while the tab is open.
  const system = window.matchMedia("(prefers-color-scheme: dark)");
  applyTheme(stored || (system.matches ? "dark" : "light"));
  system.addEventListener("change", (e) => {
    let saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); }catch{ /* ignore */ }
    if(!saved) applyTheme(e.matches ? "dark" : "light");
  });
}

function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch{ /* nothing to do */ }
}

/* A message that appears beside the work instead of on top of it. alert()
   blocks the page, cannot be styled, and prefixes everything with the host
   name — three things a product being sold should not do. */
function toast(kind, text, ms = 5200){
  const icon = { pos:"check", neg:"alert", warn:"alert", info:"info" }[kind] || "info";
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.setAttribute("role", kind === "neg" ? "alert" : "status");
  el.innerHTML = `<span class="ic">${svg(icon, 18)}</span><span>${esc(text)}</span>
    <button type="button" aria-label="סגור הודעה">${svg("x", 15)}</button>`;
  const close = () => {
    el.style.opacity = "0";
    el.style.transform = "translateY(6px)";
    setTimeout(() => el.remove(), 200);
  };
  el.querySelector("button").onclick = close;
  $("toasts").appendChild(el);
  if(ms) setTimeout(close, ms);
  return close;
}

/* Destructive actions get a real dialog rather than window.confirm, which
   cannot say which month is about to go, and cannot be read by anyone who
   needs the wording to be in Hebrew and the buttons to be labelled. */
function confirmDialog({ title, body, confirmText = "אישור", danger = true }){
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "scrim on";
    wrap.style.cssText = "display:grid;place-items:center;padding:24px";
    wrap.innerHTML = `
      <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="cdT"
           style="max-width:430px;margin:0;box-shadow:var(--sh-lg)">
        <h2 id="cdT">${esc(title)}</h2>
        <p class="sub" style="margin-top:8px">${esc(body)}</p>
        <div class="row-actions" style="justify-content:flex-start;margin-top:20px">
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-yes>${esc(confirmText)}</button>
          <button class="btn btn-secondary" data-no>ביטול</button>
        </div>
      </div>`;
    const previously = document.activeElement;
    const done = (answer) => {
      document.removeEventListener("keydown", onKey);
      wrap.remove();
      if(previously && previously.focus) previously.focus();
      resolve(answer);
    };
    const onKey = (e) => {
      if(e.key === "Escape") done(false);
      // Focus stays inside the dialog: tabbing out of a modal and operating the
      // page behind it is the classic way these go wrong.
      if(e.key === "Tab"){
        const targets = wrap.querySelectorAll("button");
        const first = targets[0], last = targets[targets.length - 1];
        if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      }
    };
    wrap.querySelector("[data-yes]").onclick = () => done(true);
    wrap.querySelector("[data-no]").onclick = () => done(false);
    wrap.onclick = (e) => { if(e.target === wrap) done(false); };
    document.addEventListener("keydown", onKey);
    document.body.appendChild(wrap);
    wrap.querySelector("[data-no]").focus();
  });
}

/* Shapes of the page that is coming, rather than the word "loading". The
   difference is whether the wait feels like progress or like a stall. */
const skeleton = (rows = 3) => `

  ${Array.from({length:rows}, () => `<div class="card">
      <div class="skeleton sk-line" style="width:170px;height:18px;margin-bottom:16px"></div>
      <div class="skeleton sk-line" style="width:100%"></div>
      <div class="skeleton sk-line" style="width:88%"></div>
      <div class="skeleton sk-line" style="width:64%;margin:0"></div>
    </div>`).join("")}`;

const initials = (text) => (text || "?").trim().split(/\s+/).slice(0, 2)
  .map(w => w[0]).join("").toUpperCase();

/* The company's own mark replaces ours in their sidebar. Theirs is the one
   that tells them at a glance whose workspace they are looking at. */
function paintIdentity(){
  const company = ME && ME.company ? ME.company.name : "";
  $("whoCompany").textContent = company;
  $("avatar").textContent = initials(company);
  const logo = ME && ME.company && ME.company.logo_b64;

              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

}

/* On a narrow screen the sidebar is a drawer. It has to close when a link is
   followed, or the person taps a page and stays looking at the menu. */
function initNavDrawer(){
  const side = $("sideNav"), scrim = $("scrim"), toggle = $("navToggle");
  const setOpen = (open) => {
    side.classList.toggle("open", open);
    scrim.hidden = !open;
    scrim.classList.toggle("on", open);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-label", open ? "סגור תפריט" : "פתח תפריט");
  };
  toggle.onclick = () => setOpen(!side.classList.contains("open"));
  scrim.onclick = () => setOpen(false);
  side.addEventListener("click", (e) => { if(e.target.closest("a")) setOpen(false); });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && side.classList.contains("open")) setOpen(false);
  });
}

/* ═══════════════════════════════════════════ what every metric means
   Written in the vocabulary of the department that reads it. "לידים", not
   "אנשים"; ROAS, CPL and CAC by name, with the definition beside them rather
   than instead of them — a media buyer knows the term and a finance lead may
   not, and both open the same dashboard.

   The reader is an organisation, not one person: several people from the same
   company look at this, each with a different job, so nothing addresses "you"
   personally or assumes who is looking. */

const GLOSSARY = {
  campaigns: { label: "קמפיינים",
    explain: "מספר הקמפיינים שיובאו למערכת בתקופה הנבחרת." },
  leads: { label: "לידים",
    explain: "פניות שהתקבלו מהקמפיינים — אנשים שהשאירו פרטים." },
  answered: { label: "לידים שנענו",
    explain: "לידים שהצוות הצליח ליצור איתם קשר טלפוני בפועל." },
  closed: { label: "המרות",
    explain: "לידים שהפכו ללקוחות משלמים." },
  spend: { label: "הוצאת מדיה",
    explain: "סך התקציב שהושקע בכלל הקמפיינים בתקופה." },
  revenue: { label: "הכנסה",
    explain: "סך ההכנסות שנוצרו מהלידים שהומרו." },
  profit: { label: "רווח נקי",
    explain: "ההכנסה בניכוי הוצאת המדיה." },
  roas: { label: "ROAS",
    explain: "החזר על הוצאות פרסום — כמה שקלים חזרו על כל שקל מדיה. "
           + "מעל 1.0 הפעילות רווחית, מתחת לכך היא מסובסדת." },
  cost_per_lead: { label: "CPL",
    explain: "עלות לליד — הוצאת המדיה חלקי מספר הלידים. יעד נמוך יותר עדיף." },
  cost_per_close: { label: "CAC",
    explain: "עלות רכישת לקוח — הוצאת המדיה חלקי מספר ההמרות." },
  answer_rate: { label: "שיעור מענה",
    explain: "אחוז הלידים שנוצר איתם קשר מתוך כלל הלידים שהתקבלו." },
  close_rate: { label: "שיעור המרה",
    explain: "אחוז הלידים שהפכו ללקוחות מתוך אלה שנוצר איתם קשר." },
  ltv_months: { label: "LTV", unit: "חודשים",
    explain: "שווי חיי לקוח — מספר החודשים שלקוח ממוצע ממשיך לשלם לפני נטישה. "
           + "לקוח שנשאר 8 חודשים שווה כפליים מלקוח שנשאר 4, גם כשה־CAC זהה." },
  upsell_rate: { label: "שיעור מכירה נוספת",
    explain: "אחוז הלקוחות שביצעו רכישה נוספת מעבר לרכישה הראשונה." },
  referral_rate: { label: "שיעור הפניות",
    explain: "אחוז הלקוחות שהביאו לקוחות נוספים בהמלצה." },
  purchase_rate: { label: "שיעור רכישה",
    explain: "אחוז הקמפיינים שהניבו לפחות רכישה אחת." },
  wasted_calls: { label: "שיחות ללא המרה",
    explain: "אחוז מזמן החייגנות שמופנה ללידים שלא הומרו בסופו של דבר." },
};

const term = (key) => GLOSSARY[key] || { label: key, explain: "" };

/* A "?" that carries the definition, for places with no room for a sentence.
   The term stays visible; the explanation is one click away. */
function hint(key){
  const t = term(key);
  if(!t.explain) return "";
  return `<button type="button" class="why" aria-label="הגדרה: ${esc(t.label)}"
            data-why="${esc(t.explain)}">?</button>`;
}

function wireHints(){
  document.querySelectorAll("[data-why]").forEach(button => {
    button.onclick = (e) => {
      e.stopPropagation();
      const open = button.nextElementSibling;
      document.querySelectorAll(".why-pop").forEach(p => p.remove());
      if(open && open.classList.contains("why-pop")) return;
      const pop = document.createElement("span");
      pop.className = "why-pop";
      pop.textContent = button.dataset.why;
      button.insertAdjacentElement("afterend", pop);
      setTimeout(() => document.addEventListener("click",
        () => pop.remove(), { once: true }), 0);
    };
  });

  /* "On what is this based" — the working shown on request rather than either
     hidden or forced on everyone. */
  document.querySelectorAll("[data-basis]").forEach(button => {
    button.onclick = () => {
      const panel = document.getElementById(button.dataset.basis);
      if(!panel) return;
      const open = !panel.hidden;
      panel.hidden = open;
      button.setAttribute("aria-expanded", String(!open));
      button.textContent = open ? "על מה זה מבוסס?" : "סגירה";
    };
  });
}

/* One tile: the metric's own term, its number, and the definition behind a
   click. Three separate lines of prose under every figure is how a dashboard
   becomes an essay. */
function tile(tint, key, value, override){
  const t = term(key);
  return `<div class="tile ${tint}">
    <div class="k">${esc(override || t.label)}${hint(key)}</div>
    <div class="v">${value}</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════ charts
   Hand-drawn SVG, no library. A chart here is a few dozen numbers at most, and
   a charting library would be a hundred kilobytes and a supply chain for
   something four functions cover. Everything scales to its container, uses the
   theme's own colours, and carries a text alternative — a picture of a number
   is useless to a screen reader unless the number is also written down. */

const PALETTE = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];

/* Bars, horizontal, because the labels are Hebrew words and Hebrew words do
   not fit under a vertical bar. */
function barChart(items, { formatter = num0, colour } = {}){
  if(!items.length) return "";
  const max = Math.max(...items.map(i => Math.abs(i.value)), 1);
  return `<div class="chart-bars" role="img"
       aria-label="${esc(items.map(i => `${i.label}: ${formatter(i.value)}`).join(", "))}">
    ${items.map((i, index) => {
      const width = Math.max(1.5, 100 * Math.abs(i.value) / max);
      const fill = i.colour || colour || PALETTE[index % PALETTE.length];
      return `<div class="cb-row">
        <span class="cb-label" title="${esc(i.label)}">${esc(i.label)}</span>
        <span class="cb-track">
          <span class="cb-fill" style="width:${width}%;background:${fill}"></span>
        </span>
        <span class="cb-value">${formatter(i.value)}${
          i.note ? `<em>${esc(i.note)}</em>` : ""}</span>
      </div>`;
    }).join("")}
  </div>`;
}

/* A funnel: each stage as a tapering band, so losing half your people looks
   like losing half your people. */
function funnelChart(stages){
  if(!stages.length) return "";
  const top = Math.max(stages[0].value, 1);
  return `<div class="chart-funnel" role="img"
       aria-label="${esc(stages.map(s => `${s.label}: ${nf.format(s.value)}`).join(", "))}">
    ${stages.map((s, i) => {
      const share = Math.max(4, 100 * s.value / top);
      const lost = i ? stages[i - 1].value - s.value : 0;
      const dropped = i && stages[i - 1].value
        ? Math.round(100 * lost / stages[i - 1].value) : 0;
      return `<div class="cf-row">
        <span class="cf-label">${esc(s.label)}</span>
        <span class="cf-bar" style="width:${share}%;
              background:linear-gradient(90deg,var(--c1),var(--c2))">
          <b>${nf.format(s.value)}</b>
        </span>
        ${i && lost > 0 ? `<span class="cf-lost">−${nf.format(lost)}
          <em>${dropped}% נשרו כאן</em></span>` : "<span></span>"}
      </div>`;
    }).join("")}
  </div>`;
}

/* A ring, for a split of a whole into three or four parts. */
function donut(parts){
  const total = parts.reduce((sum, p) => sum + p.value, 0);
  if(!total) return "";
  let offset = 0;
  const R = 58, C = 2 * Math.PI * R;
  const arcs = parts.map((p, i) => {
    const share = p.value / total;
    const arc = `<circle cx="70" cy="70" r="${R}" fill="none" stroke-width="15"
      stroke="${p.colour || PALETTE[i % PALETTE.length]}"
      stroke-dasharray="${(share * C).toFixed(2)} ${C.toFixed(2)}"
      stroke-dashoffset="${(-offset * C).toFixed(2)}"
      transform="rotate(-90 70 70)"/>`;
    offset += share;
    return arc;
  }).join("");
  return `<div class="chart-donut">
    <svg viewBox="0 0 140 140" role="img"
         aria-label="${esc(parts.map(p => `${p.label}: ${nf.format(p.value)}`).join(", "))}">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="15"/>
      ${arcs}
      <text x="70" y="68" text-anchor="middle" class="donut-total"
            textLength="${Math.min(76, 11 * nf.format(total).length)}"
            lengthAdjust="spacingAndGlyphs">${nf.format(total)}</text>
      <text x="70" y="86" text-anchor="middle" class="donut-cap">סה״כ</text>
    </svg>
    <ul class="legend">${parts.map((p, i) => `<li>
      <i style="background:${p.colour || PALETTE[i % PALETTE.length]}"></i>
      ${esc(p.label)} <b>${nf.format(p.value)}</b>
      <em>${total ? Math.round(100 * p.value / total) : 0}%</em></li>`).join("")}</ul>
  </div>`;
}

/* A line, for a value across months. Drawn as a path plus a soft fill, with a
   dot and a label on each point — the points are few and each one is a month
   somebody will want to name. */
function lineChart(points, { formatter = num0 } = {}){
  if(points.length < 2) return "";
  const W = 640, H = 190, PAD = 34;
  const values = points.map(p => p.value);
  const min = Math.min(...values, 0), max = Math.max(...values);
  const span = (max - min) || 1;
  const x = (i) => PAD + i * (W - 2 * PAD) / (points.length - 1);
  const y = (v) => H - PAD - ((v - min) / span) * (H - 2 * PAD);
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${line} L${x(points.length - 1).toFixed(1)},${H - PAD} L${PAD},${H - PAD} Z`;
  return `<div class="chart-line">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="${esc(points.map(p => `${p.label}: ${formatter(p.value)}`).join(", "))}">
      <path d="${area}" fill="url(#lineFill)" opacity=".5"/>
      <path d="${line}" fill="none" stroke="var(--c1)" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}"
        r="4.5" fill="var(--surface)" stroke="var(--c1)" stroke-width="2.5"/>`).join("")}
      <defs><linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--c1)" stop-opacity=".35"/>
        <stop offset="100%" stop-color="var(--c1)" stop-opacity="0"/>
      </linearGradient></defs>
    </svg>
    <div class="cl-axis">${points.map(p =>
      `<span><b>${formatter(p.value)}</b>${esc(p.label)}</span>`).join("")}</div>
  </div>`;
}

/* --------------------------------------------------------------- widgets */
function barRows(items){
  // items: {label, value, display, cls}
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="bars">` + items.map(i => `
    <div class="bar-row">
      <span class="bar-lbl" title="${esc(i.label)}">${i.label}</span>
      <span class="bar-track"><span class="bar ${i.cls || ""}"
            style="width:${Math.max(2, 100*i.value/max)}%"></span></span>
      <span class="bar-val">${i.display}</span>
    </div>`).join("") + `</div>`;

/* ----------------------------------------------------------------- pages */
const PAGES = {};

/* Which imported month the figures describe. All of them, unless one is
   chosen — a request that the overview be filterable by month, and the reason
   the uploads list is fetched with the rest of the session. */
let PERIOD = "";

function periodFilter(){
  const uploads = (ME.uploads || []).filter(u => u.status !== "failed");
  if(uploads.length < 2) return "";
  return `<label class="period">
    <span>תקופה</span>
    <select id="periodSel">
      <option value="">כל התקופות</option>
      ${uploads.map(u => `<option value="${u.id}"${PERIOD === u.id ? " selected" : ""}
        >${monthName(u.period)}</option>`).join("")}
    </select></label>`;
}

const HE_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני",
                   "יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function monthName(iso){
  const [y, m] = String(iso).split("-");
  return `${HE_MONTHS[+m - 1]} ${y}`;
}

/* The overview recomputes from the campaign rows rather than the server's
   totals, because those cover every period and this view may cover one. The
   definitions are the same ones the rest of the product uses. */
function periodTotals(){
  const rows = PERIOD
    ? INSIGHTS.records.filter(r => r.uploadId === PERIOD)
    : INSIGHTS.records;
  const spend = rows.reduce((a, r) => a + (r.budget || 0), 0);
  const leads = rows.reduce((a, r) => a + (r.leads || 0), 0);
  const answered = rows.reduce((a, r) => a + (r.answered || 0), 0);
  const closed = rows.reduce((a, r) => a + (r.closed || 0), 0);
  const share = INSIGHTS.records.length ? rows.length / INSIGHTS.records.length : 1;
  const profit = (INSIGHTS.summary.avgProfit || 0) * INSIGHTS.summary.total * share;
  return {
    rows: rows.length, spend, leads, answered, closed, profit,
    revenue: profit + spend,
    roas: spend ? (profit + spend) / spend : null,
    cpl: leads ? spend / leads : null,
    cac: closed ? spend / closed : null,
    answerRate: leads ? 100 * answered / leads : null,
    closeRate: answered ? 100 * closed / answered : null,
  };
}

PAGES.home = () => {
  const head = pageHead("home", periodFilter());
  if(INSIGHTS.empty) return head + emptyState("");
  const t = periodTotals();

  const kpis = `<section class="band">
    <h2 class="band-title">מדדי ליבה</h2>
    <div class="grid">
      ${tile("t1", "spend", money(t.spend))}
      ${tile("t3", "revenue", money(t.revenue))}
      ${tile("t2", "roas", t.roas == null ? na() : money(t.roas))}
      ${tile("t4", "profit", money(t.profit))}
    </div>
  </section>`;

  const funnel = `<section class="band">
    <h2 class="band-title">יעילות רכישה</h2>
    <div class="grid">
      ${tile("t2", "leads", num(t.leads))}
      ${tile("t1", "cost_per_lead", money(t.cpl))}
      ${tile("t3", "closed", num(t.closed))}
      ${tile("t5", "cost_per_close", money(t.cac))}
    </div>
  </section>`;

  const split = `<section class="card">
    <h2>הרכב ההוצאה מול ההחזר</h2>
    <p class="sub">חלוקת ההכנסה בין מה שכוסה על ידי הוצאת המדיה לבין הרווח שנותר.</p>
    ${donut([
      { label: "רווח נקי", value: Math.max(0, Math.round(t.profit)), colour: "var(--c3)" },
      { label: "הוצאת מדיה", value: Math.round(t.spend), colour: "var(--c4)" },
    ])}
    <div class="callout ${t.roas >= 1 ? "pos" : "warn"}">
      ROAS של <strong>${t.roas == null ? na() : money(t.roas)}</strong> על כל שקל מדיה.
      ${t.roas >= 1 ? "הפעילות רווחית ברמת החשבון."
                    : "הפעילות מסובסדת ברמת החשבון — ההוצאה גבוהה מההחזר."}
    </div>
  </section>`;

  const trend = trendCard();
  return head + kpis + funnel + `<div class="grid-2">${split}${trend}</div>`;
};

/* Month over month, once there is more than one month to compare. */
function trendCard(){
  const uploads = (ME.uploads || []).filter(u => u.status !== "failed")
    .slice().sort((a, b) => a.period.localeCompare(b.period));
  if(uploads.length < 2){
    return `<section class="card">
      <h2>מגמה חודשית</h2>
      <p class="sub">לאחר ייבוא של חודש נוסף תוצג כאן ההשוואה בין התקופות —
         נפח לידים, CPL ו־ROAS לאורך זמן.</p></section>`;
  }
  const points = uploads.map(u => {
    const rows = INSIGHTS.records.filter(r => r.uploadId === u.id);
    const leads = rows.reduce((a, r) => a + (r.leads || 0), 0);
    return { label: monthName(u.period), value: leads };
  });
  return `<section class="card">
    <h2>נפח לידים לפי תקופה${hint("leads")}</h2>
    <p class="sub">מספר הלידים שהתקבלו בכל חודש שיובא.</p>
    ${lineChart(points)}
  </section>`;
}

  const items = [];

  if(b.best && b.gainPct > 5){
    items.push({
      tint: "t1", tag: "הקצאת תקציב", impact: `+${pct(b.gainPct)} רווח`,
      title: `הקצאה מחדש לרמת תקציב של ${money(b.best.budgetEach)} לקמפיין`,

        כ־${num(Math.round(f.funnel[0].count / 100))} לידים נוספים במגע.`,
      chart: funnelChart(f.funnel.slice(0, 3).map(stage => ({
        label: { Leads: "לידים שהתקבלו", Answered: "לידים שנענו",

/* Whether the numbers below can be relied on, in one sentence. The measurement
   behind it is the same one as before; what changed is that the measurement
   stays on our side of the screen. */
async function renderModelCard(){
  const box = $("modelCard");
  if(!box) return;
  let data;
  try{ data = await api("/api/models"); }
  catch(e){
    if(e.message === "__expired__") return showLogin("החיבור פג. התחבר שוב.");
    box.innerHTML = "";
    return;
  }

  if(!data.models.length){
    box.innerHTML = `<section class="card">
      <h2>עוד אין מספיק נתונים לתחזית</h2>
      <p class="sub">כדי לחזות משהו על קמפיין חדש צריך לראות לפחות
        ${num(data.minRows)} קמפיינים קודמים שלך. עם פחות מזה כל תחזית תהיה
        ניחוש, ואנחנו מעדיפים לא להציג ניחוש.</p>
      <a class="btn btn-primary" href="#/upload">להעלאת עוד נתונים</a></section>`;
    return;
  }

  const usable = data.models.filter(m => m.useful);
  const rows = Math.max(...data.models.map(m => m.trainedRows));
  box.innerHTML = `<section class="card">
    <h2>כמה אפשר לסמוך על התחזיות</h2>
    <p class="sub">${usable.length
      ? `למדנו מ־${num(rows)} הקמפיינים שהעלית, ואנחנו מציגים רק תחזיות
         שהוכיחו את עצמן על הנתונים שלך.`
      : `למדנו מ־${num(rows)} הקמפיינים שהעלית, אבל עדיין לא מצאנו דפוס
         מספיק ברור כדי לחזות. זה בדרך כלל משתפר עם עוד חודשים.`}</p>
    ${usable.length ? `<div class="callout pos">
      ${usable.map(m => esc(TARGET_LABEL[m.target] || m.target)).join(" · ")}
      — התחזיות האלה עקביות מספיק כדי להציג.</div>` : ""}
    ${usable.length < data.models.length ? `<p class="note">
      על ${data.models.filter(m => !m.useful).map(m =>
        esc(TARGET_LABEL[m.target] || m.target)).join(" ו")}
      אנחנו לא מציגים תחזית — מה שראינו עד עכשיו לא מספיק עקבי.</p>` : ""}
  </section>`;
}

/* Before and against after, side by side. A percentage on its own tells nobody
   what it is a percentage of. */
function comparison(before, after, gainPct){
  return `<div class="compare">
    <div class="compare-side">
      <span class="compare-cap">${esc(before.label)}</span>
      <span class="compare-num">${money(before.profit)}</span>
      <span class="compare-sub">ROAS ${money(before.roas)}</span>
    </div>
    <div class="compare-arrow" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </div>
    <div class="compare-side is-after">
      <span class="compare-cap">${esc(after.label)}</span>
      <span class="compare-num">${money(after.profit)}</span>
      <span class="compare-sub">ROAS ${money(after.roas)}</span>
    </div>
    ${gainPct != null ? `<div class="compare-delta">+${pct(gainPct)} רווח</div>` : ""}
  </div>`;
}

    $("coForm").classList.toggle("hidden", !editing);
    $("coForm").style.display = editing ? "inline-flex" : "none";
    if(editing) $("coInput").focus();
  };
  show(false);
  $("coEdit").onclick = () => show(true);
  $("coCancel").onclick = () => { $("coInput").value = $("coName").textContent; show(false); };
  $("coSave").onclick = async () => {
    const name = $("coInput").value.trim();
    if(!name) return;
    const s = await freshSession();
    if(!s) return showLogin("החיבור פג. התחבר שוב.");
    $("coSave").disabled = true;
    try{
      const res = await fetch("/api/company", {
        method:"PATCH",
        headers:{ "Authorization":"Bearer " + s.token, "Content-Type":"application/json" },
        body: JSON.stringify({ name }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.detail || "השינוי נכשל");
      ME.company = data;
      paintIdentity();
      render();
      toast("pos", "שם החברה עודכן.");
    }catch(e){
      toast("neg", e.message);
    }finally{
      const b = $("coSave"); if(b) b.disabled = false;
    }
  };
}

/* ------------------------------------------------- the column questions */
// Answers the person has given, canonical column -> the header in their file.
// Kept outside wireUpload so a second check on the same file does not throw
// away what they already told us.
let MAPPING = {};

function sampleText(samples, header){
  const values = (samples || {})[header] || [];
  const shown = values.map(v => v === null || v === undefined ? "—" : String(v));
  return shown.length ? shown.join(" · ") : "אין דוגמאות";
}

function renderQuestions(r){
  // Anything already resolved is shown too, briefly, so the person can see
  // what was matched without being asked about it — a silent rename of every
  // column in their file is not something to discover later.
  const resolved = Object.entries(r.resolved || {});
  const done = resolved.length
    ? `<details style="margin-bottom:18px">
         <summary style="cursor:pointer;font-weight:600">
           זיהינו לבד ${resolved.length} עמודות — לחץ כדי לראות</summary>
         <div class="table-wrap" style="margin-top:10px"><table><thead><tr>
           <th>העמודה בקובץ שלך</th><th>מה המערכת הבינה</th>
         </tr></thead><tbody>${
           resolved.map(([canonical, header]) =>
             `<tr><td><bdi dir="ltr">${esc(header)}</bdi></td>
                  <td>${esc(COLUMN_LABEL[canonical] || canonical)}</td></tr>`).join("")
         }</tbody></table></div></details>`
    : "";

  const rows = r.questions.map(q => {
    const options = q.options.map(h =>
      `<option value="${esc(h)}"${MAPPING[q.column] === h ? " selected" : ""}>${esc(h)}</option>`
    ).join("");
    const hint = q.suggestion
      ? `<div class="n">אולי: <bdi dir="ltr">${esc(q.suggestion)}</bdi> — לא בטוחים מספיק, אז אנחנו שואלים.</div>`
      : "";
    return `<tr>
      <td><strong>${esc(q.label)}</strong>${hint}</td>
      <td>
        <select data-map="${esc(q.column)}" aria-label="בחר עמודה עבור ${esc(q.label)}">
          <option value="">— אין עמודה כזו בקובץ —</option>${options}
        </select>
        <div class="n" data-sample-for="${esc(q.column)}"></div>
      </td>
    </tr>`;
  }).join("");

  return `${done}
    <div class="callout warn"><h3>צריך את העזרה שלך ב־${r.questions.length} עמודות</h3>
      לא הצלחנו לזהות אותן לבד. בחר לכל שורה את העמודה המתאימה מהקובץ שלך —
      אנחנו מראים לך דוגמאות מהתוכן כדי שלא תצטרך לנחש לפי השם.</div>
    <div class="table-wrap" style="margin-top:14px"><table><thead><tr>
      <th style="width:45%">מה המערכת צריכה</th><th>העמודה שלך</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row-actions">
      <button class="btn btn-primary" id="mapApply">אישור והמשך בדיקה</button>
    </div>`;
}

function wireQuestions(r, recheck){
  const showSample = (select) => {
    const target = document.querySelector(`[data-sample-for="${select.dataset.map}"]`);
    if(!target) return;
    target.innerHTML = select.value
      ? `תוכן: <bdi dir="ltr">${esc(sampleText(r.samples, select.value))}</bdi>`
      : "";
  };
  document.querySelectorAll("[data-map]").forEach(select => {
    showSample(select);
    select.onchange = () => {
      // A header may only answer one question. Letting it answer two would
      // load the same numbers into two different columns.
      document.querySelectorAll("[data-map]").forEach(other => {
        if(other !== select && select.value && other.value === select.value){
          other.value = "";
          showSample(other);
        }
      });
      showSample(select);
    };
  });
  const apply = $("mapApply");
  if(apply) apply.onclick = () => {
    MAPPING = {};
    document.querySelectorAll("[data-map]").forEach(s => {
      if(s.value) MAPPING[s.dataset.map] = s.value;
    });
    recheck();
  };
}
