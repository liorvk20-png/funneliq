/* ═══════════════════════════════════════════ the campaigns, all of them
   This replaced a fixed sample of ten rows. Ten rows out of a few hundred
   answer no question anybody has: you cannot find your worst campaign in them,
   you cannot check the one you remember, and you cannot tell whether the ten
   are representative or the ten oldest. They were the ten oldest.

   Everything is here now, searchable and sortable, a page at a time. The
   derived figures — cost per lead, close rate — are computed in the browser
   from the same raw numbers the rest of the product uses, so no panel can
   quietly disagree with another about what a rate is. */

const TABLE_PAGE_SIZE = 25;
let TABLE = { sort: "closeRate", dir: -1, page: 0, query: "", filter: "" };

const TABLE_COLUMNS = [
  { key: "id",        label: "קמפיין",     format: (r) => "#" + nf.format(r.id) },
  { key: "budget",    label: "תקציב",      format: (r) => money(r.budget) },
  { key: "leads",     label: "לידים",      format: (r) => num(r.leads) },
  { key: "answered",  label: "נענו",       format: (r) => num(r.answered) },
  { key: "closed",    label: "המרות",      format: (r) => num(r.closed) },
  { key: "closeRate", label: "שיעור המרה", format: (r) => pct(round1(r.closeRate)) },
  { key: "cpl",       label: "CPL",        format: (r) => money(r.cpl) },
  { key: "cac",       label: "CAC",        format: (r) => money(r.cac) },
];

const round1 = (v) => Math.round(v * 10) / 10;

function campaignRows(){
  return INSIGHTS.records.map(r => ({
    ...r,
    closeRate: r.leads ? 100 * r.closed / r.leads : 0,
    answerRate: r.leads ? 100 * r.answered / r.leads : 0,
    cpl: r.leads ? r.budget / r.leads : 0,
  }));
}

function filteredRows(){
  const q = TABLE.query.trim();
  let rows = campaignRows();

  // Relative to this account. Fixed thresholds meant an account whose best
  // campaign converts at 12% saw an empty list under "the best" — the filter
  // was reporting on our expectations rather than on their data.
  const quartile = (values, q) => {
    if(!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    return sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
  };
  if(TABLE.filter === "best"){
    const cut = quartile(rows.map(r => r.closeRate), 0.75);
    rows = rows.filter(r => r.closeRate >= cut && r.closed > 0);
  }
  if(TABLE.filter === "worst"){
    const cut = quartile(rows.map(r => r.closeRate), 0.25);
    rows = rows.filter(r => r.closeRate <= cut);
  }
  if(TABLE.filter === "expensive"){
    const cut = quartile(rows.map(r => r.cpl), 0.75);
    rows = rows.filter(r => r.cpl >= cut);
  }
  if(TABLE.filter === "big") rows = rows.filter(r => r.budget > 5000);
  if(TABLE.filter === "small") rows = rows.filter(r => r.budget <= 1500);

  if(q){
    // A number matches the campaign number; anything else is ignored, because
    // there is nothing else in a row to match against yet.
    const n = Number(q.replace(/[^0-9]/g, ""));
    rows = n ? rows.filter(r => String(r.id).includes(String(n))) : [];
  }
  const key = TABLE.sort;
  return rows.sort((a, b) => (a[key] - b[key]) * TABLE.dir);
}

function campaignTableCard(){
  const rows = filteredRows();
  const pages = Math.max(1, Math.ceil(rows.length / TABLE_PAGE_SIZE));
  const page = Math.min(TABLE.page, pages - 1);
  const slice = rows.slice(page * TABLE_PAGE_SIZE, (page + 1) * TABLE_PAGE_SIZE);

  const chips = [
    ["", "כל הקמפיינים"], ["best", "רבעון עליון בהמרה"],
    ["worst", "רבעון תחתון בהמרה"], ["expensive", "CPL גבוה"],
    ["big", "תקציב גבוה"], ["small", "תקציב נמוך"],
  ].map(([key, label]) => `<button type="button" class="chip${
    TABLE.filter === key ? " on" : ""}" data-filter="${key}">${label}</button>`).join("");

  const header = TABLE_COLUMNS.map(c => `<th>
      <button type="button" class="sorter${TABLE.sort === c.key ? " on" : ""}"
              data-sort="${c.key}">
        ${esc(c.label)}${TABLE.sort === c.key
          ? `<span aria-hidden="true">${TABLE.dir === -1 ? "▾" : "▴"}</span>` : ""}
      </button></th>`).join("");

  const body = slice.length
    ? slice.map(r => `<tr>${TABLE_COLUMNS.map(c =>
        `<td>${c.format(r)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${TABLE_COLUMNS.length}" style="text-align:center;padding:36px">
         <span class="note" style="margin:0">אין קמפיינים שמתאימים למה שביקשת.</span></td></tr>`;

  return `<section class="card">
    <div class="card-head">
      <div><h2>כל הקמפיינים</h2>
        <p class="sub">${num(rows.length)} קמפיינים
          ${TABLE.filter || TABLE.query ? "מתוך " + num(INSIGHTS.records.length) : ""}.
          לחיצה על כותרת עמודה ממיינת לפיה.</p></div>
      <input id="tblSearch" type="search" placeholder="חיפוש לפי מספר קמפיין"
             value="${esc(TABLE.query)}" style="max-width:220px" aria-label="חיפוש קמפיין">
    </div>
    <div class="chips">${chips}</div>
    <div class="table-wrap"><table>
      <thead><tr>${header}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    ${pages > 1 ? `<div class="pager">
      <button type="button" class="btn btn-secondary btn-sm" data-page="${page - 1}"
              ${page === 0 ? "disabled" : ""}>הקודם</button>
      <span>עמוד <bdi dir="ltr">${page + 1}</bdi> מתוך <bdi dir="ltr">${pages}</bdi></span>
      <button type="button" class="btn btn-secondary btn-sm" data-page="${page + 1}"
              ${page >= pages - 1 ? "disabled" : ""}>הבא</button>
    </div>` : ""}
  </section>`;
}

function wireCampaignTable(){
  const redraw = () => {
    const card = document.querySelector("#pageBody .card:last-of-type");
    if(!card) return;
    card.outerHTML = campaignTableCard();
    wireCampaignTable();
  };
  document.querySelectorAll("[data-sort]").forEach(button => {
    button.onclick = () => {
      const key = button.dataset.sort;
      // Clicking the column you are already sorted by turns it around; a new
      // column starts largest-first, which is what anyone looking for their
      // best or worst campaign wants to see.
      TABLE.dir = TABLE.sort === key ? -TABLE.dir : -1;
      TABLE.sort = key; TABLE.page = 0;
      redraw();
    };
  });
  document.querySelectorAll("[data-filter]").forEach(button => {
    button.onclick = () => { TABLE.filter = button.dataset.filter; TABLE.page = 0; redraw(); };
  });
  document.querySelectorAll("[data-page]").forEach(button => {
    button.onclick = () => { TABLE.page = +button.dataset.page; redraw(); };
  });
  const search = $("tblSearch");
  if(search){
    search.oninput = () => {
      TABLE.query = search.value; TABLE.page = 0;
      redraw();
      const again = $("tblSearch");
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    };
  }
}

/* ══════════════════════════════════════════════════════ month picker
   Safari does not implement input[type=month]. It renders a plain text box —
   no calendar, no format hint, no validation — so on a Mac the field asked for
   a month and accepted any sentence, and the only thing standing between a
   typo and a rejected upload was a 400 from the server after the fact.

   This is a small calendar of its own: twelve buttons and a year stepper,
   keyboard-operable, and the value it produces is always YYYY-MM because
   nothing else can be entered. */

const MONTHS_HE = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
                   "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

function monthPicker(id, initial){
  const [y, m] = (initial || new Date().toISOString().slice(0, 7)).split("-");
  return `<div class="mp" id="${id}" data-value="${y}-${m}">
      <button type="button" class="mp-field" aria-haspopup="dialog" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/>
             <path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="mp-text">${MONTHS_HE[+m - 1]} <bdi dir="ltr">${y}</bdi></span>
        <svg class="mp-caret" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="mp-pop" role="dialog" aria-label="בחירת חודש" hidden></div>
    </div>`;
}

function wireMonthPicker(id, { max } = {}){
  const root = $(id);
  if(!root) return;
  const field = root.querySelector(".mp-field");
  const pop = root.querySelector(".mp-pop");
  const limit = max || new Date().toISOString().slice(0, 7);
  let year = +root.dataset.value.slice(0, 4);

  const paint = () => {
    const [chosenYear, chosenMonth] = root.dataset.value.split("-");
    const [maxYear, maxMonth] = limit.split("-");
    pop.innerHTML = `
      <div class="mp-head">
        <button type="button" class="btn btn-ghost btn-icon" data-step="-1" aria-label="שנה קודמת">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <strong class="num" dir="ltr">${year}</strong>
        <button type="button" class="btn btn-ghost btn-icon" data-step="1" aria-label="שנה הבאה"
                ${year >= +maxYear ? "disabled" : ""}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="mp-grid">${MONTHS_HE.map((name, index) => {
        const value = `${year}-${String(index + 1).padStart(2, "0")}`;
        // A month that has not happened yet cannot have data in it.
        const future = year > +maxYear || (year === +maxYear && index + 1 > +maxMonth);
        const selected = +chosenYear === year && +chosenMonth === index + 1;
        return `<button type="button" data-month="${value}" ${future ? "disabled" : ""}
                 class="mp-cell${selected ? " on" : ""}"
                 aria-pressed="${selected}">${name}</button>`;
      }).join("")}</div>`;

    pop.querySelectorAll("[data-step]").forEach(button => {
      button.onclick = () => { year += +button.dataset.step; paint(); };
    });
    pop.querySelectorAll("[data-month]").forEach(button => {
      button.onclick = () => {
        root.dataset.value = button.dataset.month;
        const [chosen, monthIndex] = button.dataset.month.split("-");
        root.querySelector(".mp-text").innerHTML =
          `${MONTHS_HE[+monthIndex - 1]} <bdi dir="ltr">${chosen}</bdi>`;
        close();
      };
    });
  };

  const open = () => {
    pop.hidden = false;
    field.setAttribute("aria-expanded", "true");
    year = +root.dataset.value.slice(0, 4);
    paint();
    document.addEventListener("click", outside, true);
    document.addEventListener("keydown", onKey);
    const chosen = pop.querySelector(".mp-cell.on") || pop.querySelector(".mp-cell:not([disabled])");
    if(chosen) chosen.focus();
  };
  const close = () => {
    pop.hidden = true;
    field.setAttribute("aria-expanded", "false");
    document.removeEventListener("click", outside, true);
    document.removeEventListener("keydown", onKey);
    field.focus();
  };
  const outside = (e) => { if(!root.contains(e.target)) close(); };
  const onKey = (e) => { if(e.key === "Escape"){ e.stopPropagation(); close(); } };

  field.onclick = () => (pop.hidden ? open() : close());
}

const monthValue = (id) => ($(id) ? $(id).dataset.value : null);

/* --------------------------------------------------------- page: upload */
function wireUpload(){
  const fileInput = $("upFile"), drop = $("drop");
  let chosen = null, verified = false;

  // Choosing a different file invalidates the previous check. Without this the
  // save button stays enabled from the last file and would send the new one
  // unvalidated — the server revalidates, but the person would have been shown
  // a report describing a file they are no longer uploading.
  const setFile = (f) => {
    chosen = f; verified = false;
    MAPPING = {};              // answers describe one file, not the next one
    $("dropName").textContent = f ? f.name : "";
    $("upCheck").disabled = !f;
    $("upSave").disabled = true;
    $("upReport").innerHTML = "";
  };

  drop.onclick = () => fileInput.click();
  drop.onkeydown = (e) => {
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); }
  };
  fileInput.onchange = () => setFile(fileInput.files[0] || null);
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add("over");
  }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove("over");
  }));
  drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0] || null));
  wireMonthPicker("upPeriod");

  async function send(path, extra){
    const body = new FormData();
    body.append("file", chosen);
    if(Object.keys(MAPPING).length) body.append("mapping", JSON.stringify(MAPPING));
    if(extra) Object.entries(extra).forEach(([k, v]) => body.append(k, v));
    const s = await freshSession();
    if(!s) throw new Error("__expired__");
    const res = await fetch(path, {
      method:"POST", headers:{ "Authorization":"Bearer " + s.token }, body,
    });
    if(res.status === 401){ clearSession(); throw new Error("__expired__"); }
    const data = await res.json().catch(() => ({}));
    if(!res.ok){
      const d = data.detail;
      // A rejected file comes back as a 422 whose detail is the full report, so
      // the page can show the same problem list it shows after a check.
      if(d && typeof d === "object") return { failed:true, ...d };
      throw new Error((typeof d === "string" && d) || `הבקשה נכשלה (${res.status})`);
    }
    return data;
  }

  /* Training and the narrative run after the response, so the upload sits in
     `analysing` for a few seconds. Polling `/api/me` is enough to notice, and
     it stops on its own rather than running for the life of the tab. */
  async function watchAnalysis(uploadId){
    for(let attempt = 0; attempt < 20; attempt++){
      await new Promise(r => setTimeout(r, 2000));
      if(currentPage() !== "upload") return;
      let me;
      try{ me = await api("/api/me"); }catch{ return; }
      const upload = (me.uploads || []).find(u => u.id === uploadId);
      if(!upload || upload.status === "analysing") continue;
      ME = me;
      if(currentPage() === "upload"){
        const report = $("upReport") ? $("upReport").innerHTML : "";
        $("pageBody").innerHTML = PAGES.upload();
        wireUpload();
        if(report) $("upReport").innerHTML = report;
      }
      toast(upload.status === "ready" ? "pos" : "warn",
            upload.status === "ready"
              ? "הניתוח הושלם — המודלים והתובנות מעודכנים."
              : "השורות נשמרו, אבל האימון נכשל. הנתונים עצמם תקינים.");
      return;
    }
  }

  function renderReport(r, saved){
    const list = (items) => `<ul>${items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
    let html = "";
    if(saved){
      html += `<div class="callout pos"><h3>נשמר בהצלחה</h3>
        ${num(r.rows)} שורות נוספו לחודש ${esc(r.period)}.
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn btn-primary btn-sm" href="#/data">לנתונים שלי</a>
          <a class="btn btn-secondary btn-sm" href="#/home">לדף הבית</a>
        </div></div>
      <div class="callout brand" style="display:flex;gap:10px;align-items:center">
        <span class="spinner" aria-hidden="true"></span>
        המודלים והתובנות מתאמנים ברקע על כל החודשים שהעלית. הנתונים עצמם
        כבר זמינים בכל העמודים.</div>`;
    }else if(r.ok){
      html += `<div class="callout pos"><h3>הקובץ תקין</h3>
        נמצאו ${num(r.rows)} שורות ו־${num(r.columns.length)} עמודות. אפשר לשמור.</div>`;
    }
    // Unrecognised columns are a question, not a failure. Showing the error
    // list here as well would tell the person the file is broken at the same
    // moment we ask them to finish describing it.
    if(r.needsMapping && !saved){
      html += renderQuestions(r);
    }else if(r.errors && r.errors.length){
      html += `<div class="callout neg"><h3>הקובץ לא יכול להישמר</h3>${list(r.errors)}</div>`;
    }
    if(r.warnings && r.warnings.length){
      html += `<div class="callout warn"><h3>שים לב</h3>${list(r.warnings)}
        <p style="margin-top:8px">הדברים האלה לא מונעים שמירה. שום ערך לא יתוקן אוטומטית —
           מה שבקובץ הוא מה שיישמר.</p></div>`;
    }
    if(r.preview && r.preview.length && !saved){
      const keys = Object.keys(r.preview[0]);
      html += `<h3 class="sub-head">כך המערכת קראה את חמש השורות הראשונות</h3>
        <p class="sub">אם משהו כאן נראה לא נכון, הבעיה היא בקובץ ולא בתצוגה.</p>
        <div class="table-wrap"><table><thead><tr>${
          keys.map(k => `<th><bdi dir="ltr">${esc(k)}</bdi></th>`).join("")
        }</tr></thead><tbody>${
          r.preview.map(row => `<tr>${keys.map(k => {
            const v = row[k];
            return `<td>${v === null ? na() : (typeof v === "boolean" ? bool(v) : num(v))}</td>`;
          }).join("")}</tr>`).join("")
        }</tbody></table></div>`;
    }
    $("upReport").innerHTML = html;
    if(r.needsMapping && !saved) wireQuestions(r, () => $("upCheck").click());
  }

  $("upCheck").onclick = async () => {
    const btn = $("upCheck"); btn.disabled = true; btn.textContent = "בודק…";
    try{
      const r = await send("/api/uploads/preview");
      verified = r.ok;
      $("upSave").disabled = !r.ok;
      renderReport(r, false);
    }catch(e){
      if(e.message === "__expired__") return showLogin("החיבור פג. התחבר שוב.");
      $("upReport").innerHTML = `<div class="callout neg">${esc(e.message)}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = "בדוק את הקובץ";
    }
  };

  $("upSave").onclick = async () => {
    if(!verified || !chosen) return;
    const btn = $("upSave");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> שומר…';
    // The save is several seconds even when everything works, so it says so
    // rather than leaving a disabled button to be read as a hang. That is what
    // it was read as, and reasonably.
    $("upReport").innerHTML = `<div class="callout brand">
      שומרים את השורות. זה לוקח כמה שניות — אל תסגור את החלון.</div>`;
    try{
      const r = await send("/api/uploads", { period: monthValue("upPeriod") });
      if(r.failed){ renderReport(r, false); return; }

      // The rows exist now, so the rest of the product is already correct.
      [ME, INSIGHTS] = await Promise.all([api("/api/me"), api("/api/insights")]);
      toast("pos", `נשמרו ${nf.format(r.rows)} שורות לחודש ${esc(r.period)}.`);

      // Deliberately not render(): that rebuilds the whole page from scratch,
      // which wiped the form mid-flow -- the chosen file vanished, the report
      // was written back into a fresh DOM, and the new save button arrived
      // disabled from the markup and was never re-enabled. It looked exactly
      // like a hang. The page is rebuilt only if the person is still on it.
      if(currentPage() === "upload"){
        $("pageBody").innerHTML = PAGES.upload();
        wireUpload();
        renderReport(r, true);
        watchAnalysis(r.uploadId);
      }
    }catch(e){
      if(e.message === "__expired__") return showLogin("החיבור פג. התחבר שוב.");
      $("upReport").innerHTML = `<div class="callout neg">${esc(e.message)}</div>`;
    }finally{
      const save = $("upSave");
      if(save){
        // Both, always. Restoring only the label left the button dead.
        save.disabled = !verified || !chosen;
        save.textContent = "שמור את החודש הזה";
      }
    }
  };

  $("upTemplate").onclick = () => {
    // A header row and one example line is the whole template. Naming every
    // column in the spelling the parser expects is the part people get wrong,
    // and it is the part that costs them a rejected upload.
    const header = ["ad_budget","num_leads","leads_answered","leads_not_answered",
      "followup_1","followup_2","followup_3","followup_4","followup_5",
      "not_closed","closed","calls_to_closed","calls_to_not_closed",
      "customer_acquisition_cost","ltv_months","purchased","upsell",
      "cumulative_profit","referred"].join(",");
    const example = "2000,40,25,15,20,15,9,4,1,12,3,2,4,90,6,Yes,No,4200,No";
    // The BOM is what makes Excel open a UTF-8 file without mangling it.
    const blob = new Blob(["﻿" + header + "\n" + example + "\n"],
                          { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "funneliq-template.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  wireUploadDeletes();
}

function wireUploadDeletes(){
  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async () => {
      const period = btn.dataset.period;
      const ok = await confirmDialog({
        title: `למחוק את חודש ${period}?`,
        body: "כל השורות של החודש הזה יימחקו, והמודלים יאומנו מחדש על מה שנשאר. "
            + "אי אפשר לבטל את הפעולה.",
        confirmText: "מחק את החודש",
      });
      if(!ok) return;
      btn.disabled = true; btn.textContent = "מוחק…";
      try{
        const s = await freshSession();
        if(!s) return showLogin("החיבור פג. התחבר שוב.");
        const res = await fetch("/api/uploads/" + btn.dataset.del, {
          method:"DELETE", headers:{ "Authorization":"Bearer " + s.token },
        });
        if(!res.ok) throw new Error("המחיקה נכשלה");
        [ME, INSIGHTS] = await Promise.all([api("/api/me"), api("/api/insights")]);
        render();
        toast("pos", `חודש ${period} נמחק.`);
      }catch(e){
        btn.disabled = false; btn.textContent = "מחק חודש";
        toast("neg", e.message);
      }
    };
  });
}

      SEATS = await api("/api/seats");
    }catch(e){
      if(e.message === "__expired__") return showLogin("החיבור פג. התחבר שוב.");
      $("profileBody").innerHTML = `<div class="card"><p class="sub">${esc(e.message)}</p></div>`;
      return;
    }
    $("profileBody").innerHTML = profileSection();
  }

  const invite = $("inviteBtn");
  if(invite) invite.onclick = async () => {
    invite.disabled = true; invite.textContent = "יוצר…";
    try{
      const s = await freshSession();
      if(!s) return showLogin("החיבור פג. התחבר שוב.");
      const res = await fetch("/api/seats", {
        method: "POST",
        headers: { "Authorization": "Bearer " + s.token, "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("inviteEmail").value.trim(),
                               role: $("inviteRole").value }),
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.detail || "ההזמנה נכשלה");
      SEATS = null;
      await wireSeats();
      toast("pos", `נוצרה הזמנה עבור ${data.email}. מסור לו את הקוד.`);
    }catch(e){
      toast("neg", e.message);
    }finally{
      const button = $("inviteBtn");
      if(button){ button.disabled = false; button.textContent = "צור הזמנה"; }
    }
  };

  document.querySelectorAll("[data-revoke]").forEach(button => {
    button.onclick = async () => {
      const ok = await confirmDialog({
        title: "לבטל את ההזמנה?",
        body: "הקוד יפסיק לעבוד מיד. אפשר ליצור הזמנה חדשה בכל רגע.",
        confirmText: "בטל הזמנה",
      });
      if(!ok) return;
      const s = await freshSession();
      if(!s) return showLogin("החיבור פג. התחבר שוב.");
      const res = await fetch("/api/seats/" + button.dataset.revoke,
                              { method: "DELETE",
                                headers: { "Authorization": "Bearer " + s.token } });
      if(!res.ok) return toast("neg", "הביטול נכשל");
      SEATS = null;
      await wireSeats();
      toast("pos", "ההזמנה בוטלה.");
    };
  });

  document.querySelectorAll("[data-copy]").forEach(element => {
    const copy = async () => {
      try{
        await navigator.clipboard.writeText(element.dataset.copy);
        toast("pos", "הקוד הועתק.");
      }catch{
        toast("info", "העתק את הקוד ידנית: " + element.dataset.copy);
      }
    };
    element.onclick = copy;
    element.onkeydown = (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); copy(); } };
  });
}

/* -------------------------------------------------------- page: predict */
function wirePredict(){
  const all = INSIGHTS.records.map(r => ({
    ...r,
    closeRate: r.leads ? 100 * r.closed / r.leads : 0,
    answerRate: r.leads ? 100 * r.answered / r.leads : 0,
    cpl: r.leads ? r.budget / r.leads : 0,
  }));

  const inRange = (v, spec) => {
    if(!spec) return true;
    const [lo, hi] = spec.split("-").map(Number);
    return v >= lo && v <= hi;
  };

  function fill(){
    const t = $("fTier").value;
    let list = all.filter(r =>
      (!t || r.tier === t) &&
      inRange(r.closeRate, $("fClose").value) &&
      inRange(r.cpl,       $("fCpl").value) &&
      inRange(r.answerRate,$("fAns").value) &&
      inRange(r.calls,     $("fCalls").value));

    const sort = $("fSort").value;
    // Two of these read better small-first; the rest read better large-first.
    const dir = { id:1, cpl:1 };
    list.sort((a, b) => (a[sort] - b[sort]) * (dir[sort] || -1));

    $("recCount").textContent = list.length
      ? `${nf.format(list.length)} קמפיינים תואמים מתוך ${nf.format(all.length)}`
      : "אין קמפיינים שתואמים לסינון הזה.";
    // Short enough to fit the control. The full figures are one row away in
    // the campaigns table, and a label that is cut off in the middle is worse
    // than one that stops on purpose.
    $("recSel").innerHTML = list.slice(0, 300).map(r =>
      `<option value="${r.id}">#${r.id} · ₪${nf.format(r.budget)} · ` +
      `${r.closeRate.toFixed(1)}% המרה</option>`).join("");
    $("recSel").disabled = !list.length;
    if(list.length) score();
    else $("predOut").innerHTML = "";
  }

  const score = async () => {
    const id = $("recSel").value;
    if(!id) return;
    $("predOut").innerHTML =
      `<div class="pred">${Array.from({length:4}, () => '<div class="skeleton sk-tile"></div>').join("")}</div>`;
    try{
      renderPrediction(await api("/api/predict/" + id));
    }catch(e){
      if(e.message === "__expired__") return showLogin("החיבור פג. התחבר שוב.");
      $("predOut").innerHTML = `<div class="callout neg">${esc(e.message)}</div>`;
    }
  };

  ["fTier","fClose","fCpl","fAns","fCalls","fSort"].forEach(id => $(id).onchange = fill);
  $("recSel").onchange = score;
  fill();
}

function renderPrediction(d){
  const a = d.actual;
  const shown = Object.entries(d.predictions);
  if(!shown.length){ $("predOut").innerHTML = ""; return; }

  const actual = {
    ltv_months: a.ltv_months == null ? null : num(a.ltv_months) + " חודשים",
    cumulative_profit: a.cumulative_profit == null ? null : money(a.cumulative_profit),
    upsell: a.upsell == null ? null : (a.upsell ? "כן" : "לא"),
    referred: a.referred == null ? null : (a.referred ? "כן" : "לא"),
  };
  const TINTS = { ltv_months: "t1", cumulative_profit: "t3",
                  upsell: "t2", referred: "t5" };

  const card = ([target, p]) => {
    const label = TARGET_LABEL[target] || target;
    const was = actual[target];
    if(!p.useful){
      // No number at all. A greyed-out figure with a warning beside it still
      // reads as a prediction, and this one is not.
      return `<div class="tile">
        <div class="k">${esc(label)}</div>
        <div class="v" style="font-size:var(--t-lg);color:var(--text-3)">אין תחזית</div>
        <div class="n">עוד לא ראינו מספיק קמפיינים דומים כדי לומר משהו על זה.</div>
        ${was ? `<div class="actual">מה שקרה בפועל: ${was}</div>` : ""}</div>`;
    }
    const value = p.kind === "regression"
      ? (target === "ltv_months"
          ? num(Math.round(p.value * 10) / 10) + " חודשים"
          : money(p.value))
      : pct(Math.round(p.value * 100));
    return `<div class="tile ${TINTS[target] || "t1"}">
      <div class="k">${esc(label)}</div>
      <div class="v">${value}</div>
      ${was ? `<div class="actual">מה שקרה בפועל: ${was}</div>` : ""}</div>`;
  };

  $("predOut").innerHTML = `<div class="pred">${shown.map(card).join("")}</div>
    <p class="note">התחזיות מבוססות על מה שקרה בקמפיינים דומים שלך.
      ${term("ltv_months").explain}</p>`;
}

function showLogin(msg){

  $("email").focus();

function logout(){
  clearSession();
  ME = INSIGHTS = null;
  location.hash = "";
  showLogin();
}

async function load(attempts){
  for(let i = 1; ; i++){
    try{
      return await Promise.all([api("/api/me"), api("/api/insights")]);
    }catch(e){
      // An expired session and a rejected token will fail again identically;
      // only a server that is briefly unavailable is worth a second attempt.
      if(i >= attempts || e.message === "__expired__") throw e;
      await new Promise(r => setTimeout(r, 900));
    }
  }
}

async function showApp(){
  const s = await freshSession();
  if(!s) return showLogin();
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("who").textContent = s.email || "";
  $("pageBody").innerHTML = skeleton();
  // The first authenticated request after a deploy is the one that fills the
  // server's key cache, and it is therefore the one most likely to meet a
  // network blip. Reloading the page fixed it, which means one quiet retry
  // fixes it too — without the person seeing an error at all.
  try{
    [ME, INSIGHTS] = await load(2);
  }catch(e){
    if(e.message === "__expired__") return showLogin("החיבור פג. התחבר שוב.");
    $("pageBody").innerHTML =
      `<div class="card"><h2>לא הצלחנו לטעון את הנתונים</h2>
       <p class="sub">${esc(e.message)}</p>
       <button class="btn btn-primary" id="retryBtn">נסה שוב</button></div>`;
    $("retryBtn").onclick = showApp;
    return;
  }
  paintIdentity();
  if(!location.hash) location.hash = "#/home";
  render();
}

async function paintProviders(){
  let data;
  try{
    data = await (await fetch("/api/auth/providers")).json();
  }catch{ return; }
  const list = (data.providers || []).filter(p => PROVIDER_LABEL[p]);
  if(!list.length) return;               // nothing configured, nothing shown

  $("socialBlock").classList.remove("hidden");
  $("socialButtons").innerHTML = list.map(key => {
    const p = PROVIDER_LABEL[key];
    return `<button type="button" class="btn btn-secondary" data-provider="${key}">
      ${p.mark}<span>המשך עם ${p.name}</span></button>`;
  }).join("");

  $("socialButtons").querySelectorAll("[data-provider]").forEach(button => {
    button.onclick = () => {
      // Supabase handles the redirect dance; the browser comes back to our
      // origin with a session in the URL fragment, which readFragment() picks
      // up. Nothing about the provider is trusted on our side.
      const back = encodeURIComponent(location.origin + location.pathname);
      location.href = `${data.supabaseUrl}/auth/v1/authorize`
        + `?provider=${button.dataset.provider}&redirect_to=${back}`;
    };
  });
}

/* A session, or a password-recovery token, arrives in the URL fragment — never
   in the query string, so it stays out of server logs and referrers. */
function readFragment(){
  if(!location.hash.includes("access_token")) return null;
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("access_token");
  const type = params.get("type");
  // Clear it immediately: a recovery link left in the address bar is a
  // password reset anyone with the screen can replay.
  history.replaceState(null, "", location.pathname + location.search);
  if(!token) return null;
  return { token, type, expiresIn: +(params.get("expires_in") || 3600) };
}

    }catch(e){
      $("rsErr").textContent = e.message;
      button.disabled = false; button.textContent = "שמור והיכנס";
    }
  };
}

/* -------------------------------------------------- login form behaviour */
function setMode(next){
  const up = next === "signup";
  $("tabSignIn").setAttribute("aria-selected", String(!up));
  $("tabSignUp").setAttribute("aria-selected", String(up));
  $("companyField").classList.toggle("hidden", !up);
  $("company").required = up;
  $("loginBtn").textContent = up ? "פתיחת חשבון" : "כניסה";
  $("tagline").textContent = up
    ? "פתח סביבת עבודה חדשה לחברה שלך"
    : "ניתוח קמפיינים לחברה שלך";
  $("password").setAttribute("autocomplete", up ? "new-password" : "current-password");
  // Signing up needs a real address, so the browser should validate it. Signing
  // in accepts a company name too, and type="email" would reject that before
  // the form was ever submitted.
  $("socialBlock").classList.toggle("hidden", !$("socialButtons").children.length);
  $("modeField").classList.toggle("hidden", !up);
  $("forgotRow").classList.toggle("hidden", up);
  applyJoinMode();
  $("email").type = up ? "email" : "text";
  $("emailLabel").textContent = up ? "אימייל" : "אימייל או שם חברה";
  $("emailHint").classList.toggle("hidden", up);
  say("err", ""); say("ok", "");
}
const mode = () => $("tabSignUp").getAttribute("aria-selected") === "true" ? "signup" : "signin";
const joining = () =>
  mode() === "signup"
  && document.querySelector('input[name="joinMode"]:checked').value === "join";

/* Someone joining a workspace has a code, not a company name. Asking them to
   invent one would create a second workspace with a single member in it —
   exactly what the invitation exists to prevent. */
function applyJoinMode(){
  const up = mode() === "signup";
  const join = up && joining();
  $("companyField").classList.toggle("hidden", !up || join);
  $("company").required = up && !join;
  $("inviteField").classList.toggle("hidden", !join);
  $("inviteCode").required = join;
  $("loginBtn").textContent = join ? "הצטרפות לסביבת העבודה"
                                   : (up ? "פתיחת חשבון" : "כניסה");
}

function say(kind, text){
  $(kind === "ok" ? "loginOk" : "loginErr").textContent = text;
  if(text) $(kind === "ok" ? "loginErr" : "loginOk").textContent = "";
}

$("pwToggle").onclick = () => {
  const input = $("password"), btn = $("pwToggle");
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.textContent = showing ? "הצג" : "הסתר";
  btn.setAttribute("aria-pressed", String(!showing));
  const label = showing ? "הצג סיסמה" : "הסתר סיסמה";
  btn.setAttribute("aria-label", label);
  btn.title = label;
  input.focus();
};

document.querySelectorAll('input[name="joinMode"]').forEach(radio => {
  radio.onchange = applyJoinMode;
});
$("forgotBtn").onclick = showForgot;
paintProviders();

$("tabSignIn").onclick = () => setMode("signin");
$("tabSignUp").onclick = () => setMode("signup");
$("logoutBtn").onclick = logout;
window.addEventListener("hashchange", () => { if(INSIGHTS) render(); });

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginBtn"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "רגע…";
  say("err", ""); say("ok", "");
  const email = $("email").value.trim();
  try{
    if(mode() === "signup"){
      const data = await post("/api/signup", {
        email, password: $("password").value,
        company: joining() ? "" : $("company").value.trim(),
        invitationCode: joining() ? $("inviteCode").value.trim() : "",
      });
      if(data.access_token){
        saveSession(data);
        await showApp();
      }else{
        // Email confirmation is on: the account exists but has no session yet.
        setMode("signin");
        say("ok", `החשבון עבור ${email} נוצר. שלחנו לך מייל אישור — לחץ על הקישור שבו ואז התחבר כאן.`);
      }
    }else{
      saveSession(await signIn(email, $("password").value));
      await showApp();
    }
  }catch(err){
    say("err", err.message);
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
});

$("themeBtn").onclick = toggleTheme;
initTheme();
initNavDrawer();

// A social sign-in and a recovery link both come back with a token in the URL
// fragment. Recovery lands on the new-password screen; anything else is a
// completed sign-in.
const arriving = readFragment();
if(arriving && arriving.type === "recovery"){
  showReset(arriving.token);
}else if(arriving){
  saveSession({ access_token: arriving.token, expires_in: arriving.expiresIn, user: {} });
  showApp();
}else if(readSession()){
  // readSession, not loadSession: a stored session whose access token has
  // already expired is still usable, because the refresh token outlives it.
  // Checking only the access token is what logged people out on a reload.
  showApp();
}else{
  showLogin();
}
</script>
