<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunnelIQ — Northbound Media</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3341;
    --text:#e6edf3; --muted:#8b98a9; --accent:#4c8dff; --accent2:#2ea043;
    --warn:#d29922; --danger:#f85149; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:32px}
  .brand{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
  .brand span{color:var(--accent)}
  .tagline{color:var(--muted);font-size:13px;margin:0 0 26px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;
    text-transform:uppercase;letter-spacing:.06em}
  input{width:100%;padding:10px 12px;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:7px;font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:22px;padding:11px;background:var(--accent);color:#fff;border:0;
    border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{margin-top:16px;padding:10px 12px;border-radius:7px;font-size:13px;display:none}
  .msg.err{display:block;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);color:#ffb3ae}

  /* ---------- app ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header .brand{font-size:19px;margin:0}
  .who{color:var(--muted);font-size:13px}
  .logout{width:auto;margin:0;padding:7px 14px;background:transparent;border:1px solid var(--line);
    color:var(--muted);font-weight:500}
  .logout:hover{color:var(--text);border-color:var(--muted);filter:none}
  main{padding:22px;max-width:1100px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:30px 0 12px;font-weight:600}
  h2:first-child{margin-top:0}

  .tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .tile .k{font-size:12px;color:var(--muted);margin-bottom:7px}
  .tile .v{font-size:25px;font-weight:650;letter-spacing:-.5px}
  .tile .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:2px}

  .bars{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bar-row:last-child{margin-bottom:0}
  .bar-lbl{width:42px;font-size:13px;color:var(--muted)}
  .bar-track{flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:5px}
  .bar-val{width:110px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .yes{background:rgba(46,160,67,.16);color:#6ee787}
  .no{background:rgba(139,152,169,.14);color:var(--muted)}
  .null{color:#5d6b7d;font-style:italic}
  .note{color:var(--muted);font-size:12px;margin-top:10px}
  .curve{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .crow{display:flex;align-items:center;gap:12px;margin-bottom:7px}
  .crow:last-child{margin-bottom:0}
  .clbl{width:62px;font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .ctrack{flex:1;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .cfill{height:100%;border-radius:4px}
  .cval{width:56px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
  .t-Low{background:#6e7681}.t-Mid{background:var(--accent2)}.t-High{background:#f85149}
  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:middle}

  .pred{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}
  .pcard{background:var(--panel2);border-radius:8px;padding:14px}
  .pcard .k{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .pcard .v{font-size:22px;font-weight:650}
  .pcard .cmp{font-size:11.5px;color:var(--muted);margin-top:4px}
  .warn{color:var(--warn);font-size:11.5px;margin-top:4px}
  select{padding:8px 10px;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:6px;font-size:13px;max-width:100%}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:28px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login-wrap">
  <form class="login" id="loginForm">
    <h1 class="brand">Funnel<span>IQ</span></h1>
    <p class="tagline">Northbound Media &middot; marketing analytics</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
    <div class="msg err" id="loginErr"></div>
  </form>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="appView" class="hidden">
  <header>
    <h1 class="brand">Funnel<span>IQ</span></h1>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="who" id="who"></span>
      <button class="logout" id="logoutBtn">Sign out</button>
    </div>
  </header>
  <main>
    <h2>Portfolio overview</h2>
    <div class="tiles" id="tiles"></div>

    <h2>Campaigns by budget tier</h2>
    <div class="bars" id="bars"></div>

    <h2>Score a campaign</h2>
    <div class="pred">
      <label for="recSel" style="display:block;font-size:12px;color:var(--muted);margin-bottom:7px">
        Pick a campaign to run all three models against
      </label>
      <select id="recSel"></select>
      <div id="predOut"></div>
    </div>

    <h2>Return on ad spend, by budget level</h2>
    <div class="curve" id="curve"></div>

    <h2>Sample records</h2>
    <div class="table-wrap"><table id="tbl">
      <thead><tr>
        <th>Budget</th><th>Tier</th><th>Leads</th><th>Closed</th>
        <th>CAC</th><th>LTV (mo)</th><th>Profit</th><th>Upsell</th><th>Referred</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
    <p class="note" id="note"></p>
  </main>
  <footer>FunnelIQ &middot; data served under row-level security</footer>
</div>

<script>
const TOKEN_KEY = "funneliq.token";
const $ = (id) => document.getElementById(id);
let cfg = null;

async function getConfig(){
  if (!cfg) cfg = await (await fetch("/api/config")).json();
  return cfg;
}

/* ---------------- auth ---------------- */
async function signIn(email, password){
  const c = await getConfig();
  const res = await fetch(`${c.supabaseUrl}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { "apikey": c.publishableKey, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || data.error || "Sign-in failed");
  return data;                      // { access_token, user, ... }
}

function saveSession(d){
  localStorage.setItem(TOKEN_KEY, JSON.stringify({
    token: d.access_token,
    email: d.user && d.user.email,
    // expires_at is seconds since epoch; keep it so we can drop a stale token
    // before making a request that would just come back 401.
    expiresAt: d.expires_at || (Math.floor(Date.now()/1000) + (d.expires_in || 3600))
  }));
}

function loadSession(){
  try {
    const s = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
    if (!s || !s.token) return null;
    if (s.expiresAt && s.expiresAt < Math.floor(Date.now()/1000)) { clearSession(); return null; }
    return s;
  } catch { return null; }
}

const clearSession = () => localStorage.removeItem(TOKEN_KEY);

/* ---------------- api ---------------- */
async function api(path){
  const s = loadSession();
  if (!s) throw new Error("no session");
  const res = await fetch(path, { headers: { "Authorization": "Bearer " + s.token } });
  if (res.status === 401) { clearSession(); showLogin("Your session expired. Please sign in again."); throw new Error("401"); }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

/* ---------------- render ---------------- */
const nf = new Intl.NumberFormat("en-US");
const money = (v) => v == null ? '<span class="null">n/a</span>' : "$" + nf.format(Math.round(v));
const bool = (v) => v ? '<span class="pill yes">Yes</span>' : '<span class="pill no">No</span>';

function renderTiles(s){
  const t = [
    ["Records",        nf.format(s.total)],
    ["Avg LTV",        s.avgLtvMonths + "<small> mo</small>"],
    ["Avg profit",     "$" + nf.format(Math.round(s.avgProfit))],
    ["Purchase rate",  s.purchaseRate + "<small>%</small>"],
    ["Upsell rate",    s.upsellRate + "<small>%</small>"],
    ["Referral rate",  s.referralRate + "<small>%</small>"],
  ];
  $("tiles").innerHTML = t.map(([k,v]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function renderBars(s){
  const max = Math.max(...s.tiers.map(x => x.count), 1);
  $("bars").innerHTML = s.tiers.map(x => `
    <div class="bar-row">
      <div class="bar-lbl">${x.tier}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(x.count/max*100).toFixed(1)}%"></div></div>
      <div class="bar-val">${nf.format(x.count)} campaigns</div>
    </div>`).join("");
}

function renderTable(records){
  $("tbl").querySelector("tbody").innerHTML = records.map(r => `
    <tr>
      <td>$${nf.format(r.ad_budget)}</td>
      <td>${r.budget_tier}</td>
      <td>${r.num_leads}</td>
      <td>${r.closed}</td>
      <td>$${nf.format(r.customer_acquisition_cost)}</td>
      <td>${r.ltv_months == null ? '<span class="null">n/a</span>' : r.ltv_months}</td>
      <td>${money(r.cumulative_profit)}</td>
      <td>${bool(r.upsell)}</td>
      <td>${bool(r.referred)}</td>
    </tr>`).join("");
}

function renderCurve(curve){
  const max = Math.max(...curve.map(c => c.returnPerShekel));
  $("curve").innerHTML = curve.map(c => `
    <div class="crow">
      <div class="clbl">$${nf.format(c.budget)}</div>
      <div class="ctrack"><div class="cfill t-${c.tier}" style="width:${(c.returnPerShekel/max*100).toFixed(1)}%"></div></div>
      <div class="cval">${c.returnPerShekel.toFixed(2)}x</div>
    </div>`).join("") +
    `<div class="legend">
       <span><i class="t-Low"></i>Low</span>
       <span><i class="t-Mid"></i>Mid</span>
       <span><i class="t-High"></i>High</span>
       <span>Below 1.00x the campaign returns less profit than it spent.</span>
     </div>`;
}

function renderPrediction(d){
  const p = d.predicted, a = d.actual;
  const fmtA = (v, suffix) => v == null ? "n/a" : v + (suffix || "");
  $("predOut").innerHTML = `
    <div class="pgrid">
      <div class="pcard">
        <div class="k">Predicted LTV</div>
        <div class="v">${p.ltvMonths}<small style="font-size:13px;color:var(--muted)"> mo</small></div>
        <div class="cmp">±${p.ltvMarginMonths} typical error &middot; actual ${fmtA(a.ltvMonths)}</div>
      </div>
      <div class="pcard">
        <div class="k">Upsell probability</div>
        <div class="v">${(p.upsellProbability*100).toFixed(0)}%</div>
        <div class="cmp">actual: ${a.upsell ? "upsold" : "did not"}</div>
      </div>
      <div class="pcard">
        <div class="k">Super-customer score</div>
        <div class="v">${p.superCustomerScore}<small style="font-size:13px;color:var(--muted)">/100</small></div>
        <div class="cmp">actual: ${a.referred ? "referred" : "did not refer"}</div>
        ${p.scoreCaveat ? `<div class="warn">⚠ ${p.scoreCaveat}</div>` : ""}
      </div>
      <div class="pcard">
        <div class="k">Budget tier</div>
        <div class="v">${p.budgetTier}</div>
        <div class="cmp">actual profit ${money(a.cumulativeProfit)}</div>
      </div>
    </div>`;
}

/* ---------------- views ---------------- */
function showLogin(msg){
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  const box = $("loginErr");
  if (msg) { box.textContent = msg; box.classList.add("err"); box.style.display = "block"; }
  else { box.style.display = "none"; }
}

async function showApp(){
  const s = loadSession();
  $("who").textContent = s.email || "";
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  const [summary, sample, curve] = await Promise.all([
    api("/api/summary"), api("/api/funnel-records/sample"), api("/api/budget-curve")
  ]);
  renderTiles(summary);
  renderBars(summary);
  renderTable(sample.records);
  renderCurve(curve.curve);

  const sel = $("recSel");
  sel.innerHTML = sample.records.map(r =>
    `<option value="${r.id}">#${r.id} — $${nf.format(r.ad_budget)} budget, ${r.num_leads} leads, ${r.closed} closed</option>`
  ).join("");
  const score = async () => {
    $("predOut").innerHTML = '<p class="note">Scoring…</p>';
    renderPrediction(await api("/api/predict/" + sel.value));
  };
  sel.addEventListener("change", score);
  await score();
  $("note").textContent =
    `Showing ${sample.count} of ${nf.format(summary.total)} records. ` +
    `${summary.missing.ltvMonths} rows missing LTV, ` +
    `${summary.missing.cumulativeProfit} missing cumulative profit — left as NULL, not imputed.`;
}

/* ---------------- wiring ---------------- */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginBtn");
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    saveSession(await signIn($("email").value.trim(), $("password").value));
    $("password").value = "";
    await showApp();
  } catch (err) {
    showLogin(err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
});

$("logoutBtn").addEventListener("click", () => { clearSession(); showLogin(); });

(async () => {
  if (loadSession()) { try { await showApp(); } catch { showLogin(); } }
  else showLogin();
})();
</script>
</body>
</html>
