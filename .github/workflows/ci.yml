name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          pip install ruff
          ruff check app scripts analysis tests
      - name: Test
        # No secrets and no network: every test reads the committed CSV or feeds
        # hand-built rows through the same functions the API uses.
        run: pytest tests -q
